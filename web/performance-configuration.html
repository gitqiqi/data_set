    function renewalTargetPeriodPickerMarkup(orderedPeriodIds) {
      return `
        <span class="month-year-group renewal-target-period-group" role="group" aria-label="续报期次（单选）">
          <span class="month-year-title">续报期次</span>
          <span class="month-grid">
            ${orderedPeriodIds.map((groupKey) => `
              <button class="month-option${activeRenewalPeriodId === groupKey ? " active" : ""}" type="button" role="option" aria-selected="${activeRenewalPeriodId === groupKey}" data-renewal-period-id="${escapeAttr(groupKey)}">
                ${escapeHtml(renewalTargetPeriodLabel(groupKey))}
              </button>
            `).join("")}
          </span>
        </span>
      `;
    }

    function monthPickerMarkup(orderedMonths) {
      const groups = groupMonthsByYear(orderedMonths);
      return [...groups.entries()].map(([year, yearMonths]) => `
        <span class="month-year-group" role="group" aria-label="${escapeAttr(`${year}年`)}">
          <span class="month-year-title">${escapeHtml(`${year}年`)}</span>
          <span class="month-grid">
            ${yearMonths.map((month) => `
              <button class="month-option${month === activeMonth ? " active" : ""}" type="button" role="option" aria-selected="${month === activeMonth}" data-month="${escapeAttr(month)}">
                ${escapeHtml(formatMonthShortLabel(month))}
              </button>
            `).join("")}
          </span>
        </span>
      `).join("");
    }

    function groupMonthsByYear(orderedMonths) {
      const groups = new Map();
      orderedMonths.forEach((month) => {
        const key = monthKey(month);
        const year = key.slice(0, 4) || "月份";
        if (!groups.has(year)) groups.set(year, []);
        groups.get(year).push(key);
      });
      return groups;
    }

    function formatMonthShortLabel(value) {
      const key = monthKey(value);
      const month = Number(key.slice(5, 7));
      return month ? `${month}月` : formatMonthLabel(value);
    }

    function toggleMonthPicker() {
      if (els.monthFilter.disabled) return;
      monthPickerOpen = !monthPickerOpen;
      closeAddRenewalPeriodPicker();
      closeRenewalTargetPicker(false);
      closeRangePopovers();
      closePeriodPopovers();
      if (activeModule === renewalTargetModuleKey) {
        renderRenewalTargetFilter();
      } else {
        renderMonthFilter();
      }
    }

    function closeMonthPicker() {
      if (!monthPickerOpen) return;
      monthPickerOpen = false;
      els.monthFilter.setAttribute("aria-expanded", "false");
      els.monthFilterPopover.hidden = true;
    }

    function toggleAddRenewalPeriodPicker() {
      if (!requireEditPermission()) return;
      const options = renewalTargetAvailablePeriodOptions.length
        ? renewalTargetAvailablePeriodOptions
        : renewalTargetPeriodOptions;
      if (!options.length) {
        showToast("暂无可选期次");
        return;
      }
      addRenewalPeriodIds = [];
      addRenewalPeriodPickerOpen = !addRenewalPeriodPickerOpen;
      closeMonthPicker();
      closeRenewalTargetPicker(false);
      closeRangePopovers();
      closePeriodPopovers();
      renderAddRenewalPeriodPicker();
    }

    function closeAddRenewalPeriodPicker() {
      addRenewalPeriodPickerOpen = false;
      addRenewalPeriodIds = [];
      if (!els.addRenewalPeriodPopover) return;
      els.addRenewalPeriodPopover.hidden = true;
      els.addRenewalPeriodPopover.innerHTML = "";
    }

    function toggleAddRenewalTargetPeriod(periodId) {
      const value = normalizeIntegerText(periodId);
      if (!value) return;
      if (addRenewalPeriodIds.includes(value)) {
        addRenewalPeriodIds = addRenewalPeriodIds.filter((periodId) => periodId !== value);
      } else {
        addRenewalPeriodIds = [...addRenewalPeriodIds, value]
          .filter((periodId, index, values) => values.indexOf(periodId) === index)
          .sort((a, b) => Number(b) - Number(a));
      }
      renderAddRenewalPeriodPicker();
    }

    function selectMonth(nextMonthValue) {
      const nextMonthValueKey = monthKey(nextMonthValue);
      closeMonthPicker();
      if (!nextMonthValueKey || nextMonthValueKey === activeMonth) return;
      activeMonth = nextMonthValueKey;
      closeRenewalTargetPicker(false);
      closeRangePopovers();
      closePeriodPopovers();
      render();
    }

    function selectRenewalTargetPeriod(periodId) {
      const nextGroupKey = normalizeRenewalPeriodGroupKey(periodId);
      if (!nextGroupKey) return;
      activeRenewalPeriodIds = [nextGroupKey];
      activeRenewalPeriodId = nextGroupKey;
      closeRenewalTargetPicker(false);
      render();
    }

    function selectRenewalTargetPeriodForNewRow(periodIds) {
      const nextPeriodIds = normalizeRenewalPeriodIds(periodIds);
      closeAddRenewalPeriodPicker();
      if (!nextPeriodIds.length) {
        showToast("请至少选择一个期次");
        return;
      }
      const groupKey = ensureRenewalTargetGroupInFilter(nextPeriodIds);
      activeRenewalPeriodIds = [groupKey];
      activeRenewalPeriodId = groupKey;
      addRenewalTargetRow(nextPeriodIds);
    }

    function renewalTargetFilterLabel() {
      const selected = activeRenewalPeriodIds.length
        ? [activeRenewalPeriodIds[0]]
        : (activeRenewalPeriodId ? [activeRenewalPeriodId] : []);
      if (!selected.length) return "";
      return renewalTargetPeriodLabel(selected[0]);
    }

    function renewalTargetFilterTitle() {
      const selected = activeRenewalPeriodIds.length
        ? [activeRenewalPeriodIds[0]]
        : (activeRenewalPeriodId ? [activeRenewalPeriodId] : []);
      return selected.length ? renewalTargetPeriodLabel(selected[0]) : "";
    }

    function renewalTargetPeriodOptionById(groupKey) {
      const value = normalizeRenewalPeriodGroupKey(groupKey);
      return renewalTargetPeriodOptions.find((item) => item.id === value)
        || renewalTargetAvailablePeriodOptions.find((item) => item.id === value)
        || null;
    }

    function renewalTargetPeriodLabel(groupKey) {
      const value = normalizeRenewalPeriodGroupKey(groupKey);
      const option = renewalTargetPeriodOptionById(value);
      return option?.periodName || (value ? value.split("+").map((id) => `续报期 ${id}`).join("+") : "选择期次");
    }

    function ensureRenewalTargetGroupInFilter(periodIds) {
      const normalizedPeriodIds = normalizeRenewalPeriodIds(periodIds);
      const groupKey = normalizeRenewalPeriodGroupKey(normalizedPeriodIds);
      if (!groupKey) return "";
      if (renewalTargetPeriodIds.includes(groupKey)) return groupKey;

      const names = normalizedPeriodIds.map((periodId) => {
        const option = renewalTargetAvailablePeriodOptions.find((item) => item.id === periodId);
        return option?.periodName || `续报期 ${periodId}`;
      });
      const option = {
        id: groupKey,
        periodIds: normalizedPeriodIds,
        periodGroupKey: groupKey,
        periodName: names.join("+")
      };
      renewalTargetPeriodIds.push(groupKey);
      renewalTargetPeriodIds.sort((a, b) => renewalTargetGroupSortValue(b) - renewalTargetGroupSortValue(a));
      renewalTargetPeriodOptions.push(option);
      renewalTargetPeriodOptions.sort((a, b) => renewalTargetGroupSortValue(b.id) - renewalTargetGroupSortValue(a.id));
      return groupKey;
    }

    function ensureRenewalTargetPeriodInFilter(periodId) {
      return ensureRenewalTargetGroupInFilter([periodId]);
    }

    function renderMetricTemplates(auth = resolvePermissionState()) {
      if (!auth.canEdit || isLoadingConfiguration) {
        els.metricTemplateShelf.hidden = true;
        els.metricTemplateShelf.innerHTML = "";
        return;
      }

      const usedModules = new Set(recordsForActiveMonth().map((record) => record.module.trim()).filter(Boolean));
      const templates = metricTemplates();
      els.metricTemplateShelf.hidden = false;
      els.metricTemplateShelf.innerHTML = `
        <div class="template-shelf-title">指标</div>
        <div class="template-chip-list">
          ${templates.map((template) => {
            const used = usedModules.has(template.module);
            return `
              <button class="metric-template-chip${used ? " is-used" : ""}" type="button" data-template-module="${escapeAttr(template.module)}"${used ? " disabled" : ' draggable="true"'} title="${escapeAttr(used ? "当前月份已添加" : template.module)}">
                ${escapeHtml(template.module)}
              </button>
            `;
          }).join("")}
        </div>
      `;

      els.metricTemplateShelf.querySelectorAll("[data-template-module]:not(:disabled)").forEach((chip) => {
        chip.addEventListener("dragstart", (event) => {
          draggingTemplateModule = chip.dataset.templateModule || "";
          event.dataTransfer.effectAllowed = "copy";
          event.dataTransfer.setData("text/plain", draggingTemplateModule);
          event.dataTransfer.setData("application/x-performance-metric-template", draggingTemplateModule);
        });
        chip.addEventListener("dragend", () => {
          draggingTemplateModule = "";
          els.metricWrap.classList.remove("template-drag-over");
          clearDragIndicators();
        });
      });
    }

    function metricTemplates() {
      return metricTemplateNames.map((module) => ({ module }));
    }

    function renderMetrics(auth = resolvePermissionState()) {
      if (activeModule !== "performance") return;
      if (!auth.canView) {
        renderNoPermission();
        return;
      }

      const readonly = !auth.canEdit;
      const readonlyAttr = readonly ? " readonly" : "";
      const disabledAttr = readonly ? " disabled" : "";
      const rows = recordsForActiveMonth();

      if (isLoadingConfiguration) {
        els.metricWrap.innerHTML = '<div class="empty-state">正在加载绩效配置。</div>';
        return;
      }

      if (!rows.length) {
        els.metricWrap.innerHTML = '<div class="empty-state">当前月份暂无指标。</div>';
        return;
      }

      const table = document.createElement("div");
      table.className = `metric-table${readonly ? " is-readonly" : ""}`;
        table.innerHTML = `
        <div class="table-head">
          <div>指标</div>
          <div>期别</div>
          <div>类型</div>
          <div>时间范围</div>
          <div>配置项</div>
        </div>
      `;

      rows.forEach((record) => {
        const row = document.createElement("div");
        row.className = "metric-row";
        row.dataset.id = record.id;
        row.innerHTML = `
          <div class="cell metric-name-cell">
            <button class="drag-handle" type="button" draggable="true" title="拖动排序" aria-label="拖动排序"${readonly ? " hidden disabled" : ""}>
              <span class="drag-grip" aria-hidden="true"></span>
            </button>
            <span class="metric-name-text${readonly ? "" : " metric-drag-source"}" title="${escapeAttr(record.module)}"${readonly ? "" : ' draggable="true"'}>${escapeHtml(record.module)}</span>
          </div>
          <div class="cell">
            ${periodControl(record, readonly)}
          </div>
          <div class="cell">
            ${typeControl(record, readonly)}
          </div>
          <div class="cell">
            <div class="range-picker">
              <button class="range-trigger" type="button"${disabledAttr}>
                <span class="range-text" title="${escapeAttr(rangeLabel(record))}">${rangeLabelMarkup(record)}</span>
                <svg class="range-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M8 2v4M16 2v4M3.5 9.5h17M6 5h12a2.5 2.5 0 0 1 2.5 2.5v10A2.5 2.5 0 0 1 18 20H6a2.5 2.5 0 0 1-2.5-2.5v-10A2.5 2.5 0 0 1 6 5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                </svg>
              </button>
              <div class="range-popover" hidden>
                ${rangeCalendar(record)}
              </div>
            </div>
          </div>
          <div class="cell">
            <textarea class="textarea" data-field="content" placeholder="备注，可留空"${readonlyAttr}>${escapeHtml(record.content)}</textarea>
          </div>
        `;

        if (!readonly) {
          row.querySelectorAll("[data-field]").forEach((field) => {
            field.addEventListener("input", (event) => updateRecord(record.id, event.target.dataset.field, event.target.value, event.target));
            field.addEventListener("change", (event) => updateRecord(record.id, event.target.dataset.field, event.target.value, event.target));
          });
          bindDragHandle(row, record.id);
          row.querySelector(".range-trigger").addEventListener("click", (event) => {
            event.stopPropagation();
            closePeriodPopovers();
            closeRangePopovers(row);
            openRangePicker(row, record.id);
            row.querySelector(".range-popover").hidden = false;
          });
          row.querySelector(".range-popover").addEventListener("click", (event) => {
            event.stopPropagation();
          });
          bindRangeCalendar(row, record.id);
          row.querySelectorAll(".period-trigger").forEach((trigger) => {
            trigger.addEventListener("click", (event) => {
              event.stopPropagation();
              const picker = trigger.closest(".period-picker");
              closeRangePopovers();
              closePeriodPopovers(picker);
              picker.querySelector(".period-popover").hidden = false;
            });
          });
          row.querySelectorAll(".period-popover").forEach((popover) => {
            popover.addEventListener("click", (event) => {
              event.stopPropagation();
            });
          });
          row.querySelectorAll("[data-period]").forEach((option) => {
            option.addEventListener("click", (event) => {
              event.stopPropagation();
              selectPeriod(record.id, option.dataset.periodField, option.dataset.period, option);
            });
          });
        }
        table.appendChild(row);
      });

      els.metricWrap.innerHTML = "";
      els.metricWrap.appendChild(table);
    }

    function renderRenewalTargets(auth = resolvePermissionState()) {
      if (activeModule !== renewalTargetModuleKey) return;
      if (!auth.canView) {
        renderNoPermission();
        return;
      }

      els.metricTemplateShelf.hidden = true;
      els.metricTemplateShelf.innerHTML = "";

      if (isLoadingRenewalTargets) {
        els.metricWrap.innerHTML = '<div class="empty-state">正在加载续报目标。</div>';
        return;
      }

      const readonly = !auth.canEdit;
      const readonlyAttr = readonly ? " readonly" : "";
      const rows = renewalTargetRowsForPeriod();

      if (!rows.length && readonly) {
        els.metricWrap.innerHTML = '<div class="empty-state">当前期次暂无续报目标。</div>';
        return;
      }

      const table = document.createElement("div");
      table.className = `renewal-target-table${readonly ? " is-readonly" : ""}`;
      table.innerHTML = `
        <div class="table-head">
          <div>年级</div>
          <div>班型</div>
          <div>版本</div>
          ${renewalTargetRateFields.map((field) => `<div>${escapeHtml(field.label)}</div>`).join("")}
          <div>操作</div>
        </div>
      `;

      rows.forEach((record) => {
        const row = document.createElement("div");
        row.className = "renewal-target-row";
        row.dataset.id = record.id;
        row.innerHTML = `
          <div class="cell renewal-target-grade-cell">
            <button class="drag-handle renewal-target-drag-handle" type="button" draggable="true" title="拖动排序" aria-label="拖动排序"${readonly ? " hidden disabled" : ""}>
              <span class="drag-grip" aria-hidden="true"></span>
            </button>
            ${renewalTargetTagPicker(record, "grade", "选择年级", renewalTargetGradeOptions(record), readonly)}
          </div>
          <div class="cell">
            ${renewalTargetTagPicker(record, "classMode", "选择班型", renewalTargetClassModeOptions(record), readonly)}
          </div>
          <div class="cell">
            ${renewalTargetTagPicker(record, "classVersion", "选择版本", renewalTargetClassVersionOptions(record), readonly)}
          </div>
          ${renewalTargetRateFields.map((field) => `
            <div class="cell">
              <input class="input" inputmode="decimal" data-renewal-field="${escapeAttr(field.key)}" value="${escapeAttr(record[field.key])}"${readonlyAttr}>
            </div>
          `).join("")}
          <div class="cell">
            <button class="row-action-button" type="button"${readonly ? " hidden disabled" : ""}>删除</button>
          </div>
        `;

        if (!readonly) {
          row.querySelectorAll("[data-renewal-field]").forEach((field) => {
            field.addEventListener("input", (event) => updateRenewalTargetRecord(record.id, event.target.dataset.renewalField, event.target.value));
            field.addEventListener("change", (event) => updateRenewalTargetRecord(record.id, event.target.dataset.renewalField, event.target.value));
          });
          bindRenewalTargetDragHandle(row, record.id);
          row.querySelectorAll("[data-renewal-picker-trigger]").forEach((button) => {
            button.addEventListener("click", (event) => {
              event.stopPropagation();
              toggleRenewalTargetPicker(record.id, button.dataset.renewalPickerTrigger);
            });
          });
          row.querySelectorAll(".renewal-tag-popover").forEach((popover) => {
            popover.addEventListener("click", (event) => event.stopPropagation());
          });
          row.querySelectorAll("[data-renewal-tag-value]").forEach((button) => {
            button.addEventListener("click", () => {
              selectRenewalTargetValue(record.id, button.dataset.renewalTagField, button.dataset.renewalTagValue);
            });
          });
          row.querySelectorAll("[data-renewal-tag-clear]").forEach((button) => {
            button.addEventListener("click", () => {
              selectRenewalTargetValue(record.id, button.dataset.renewalTagClear, "");
            });
          });
          row.querySelector(".row-action-button").addEventListener("click", () => softDeleteRenewalTargetRecord(record.id));
        }
        table.appendChild(row);
      });

      if (!readonly) {
        table.insertAdjacentHTML("beforeend", `
          <div class="renewal-target-add-row">
            <button class="renewal-target-add-button" type="button" data-renewal-target-add-row title="新增目标行（复制上一行）" aria-label="新增目标行（复制上一行）">+</button>
          </div>
        `);
        table.querySelector("[data-renewal-target-add-row]")?.addEventListener("click", () => {
          addRenewalTargetRowAfterLast(rows);
        });
      }

      els.metricWrap.innerHTML = "";
      els.metricWrap.appendChild(table);
    }

    function renewalTargetTagPicker(record, field, placeholder, options, readonly = false) {
      const selectedValues = renewalTargetSelectedValues(record, field);
      if (readonly) {
        return selectedValues.length ? renewalTargetSelectedTagsMarkup(selectedValues) : '<span class="ghost-value">-</span>';
      }

      return `
        <span class="renewal-tag-picker" data-renewal-tag-picker="${escapeAttr(field)}">
          <button class="renewal-tag-trigger" type="button" data-renewal-picker-trigger="${escapeAttr(field)}">
            ${selectedValues.length ? renewalTargetSelectedTagsMarkup(selectedValues) : `<span class="renewal-tag-placeholder${field === "classVersion" ? " is-empty" : ""}">${escapeHtml(placeholder)}</span>`}
          </button>
          <span class="renewal-tag-popover" ${isRenewalTargetPickerOpen(record.id, field) ? "" : "hidden"}>
            ${field === "classVersion" && selectedValues.length ? `
              <button class="renewal-tag-clear" type="button" data-renewal-tag-clear="${escapeAttr(field)}">清空版本</button>
            ` : ""}
            <span class="renewal-tag-options">
              ${options.map((option) => `
                <button class="renewal-tag-option${selectedValues.includes(option) ? " selected" : ""}" type="button" data-renewal-tag-field="${escapeAttr(field)}" data-renewal-tag-value="${escapeAttr(option)}">
                  ${escapeHtml(option)}
                </button>
              `).join("")}
            </span>
          </span>
        </span>
      `;
    }

    function renewalTargetSelectedTagsMarkup(values) {
      return `
        <span class="renewal-selected-tags">
          ${values.map((value) => `<span class="renewal-selected-tag" title="${escapeAttr(value)}">${escapeHtml(value)}</span>`).join("")}
        </span>
      `;
    }

    function renewalTargetSelectedValues(record, field) {
      const value = field === "grade"
        ? normalizeIntegerText(record?.grade)
        : String(record?.[field] ?? "").trim();
      return value ? [value] : [];
    }

    function renewalTargetClassModeOptions(record = null) {
      const existing = renewalTargetRecords.map((record) => record.classMode);
      const currentValue = record ? [record.classMode] : [];
      return sortRenewalTargetTagValues("classMode", unique([
        ...defaultRenewalTargetClassModeOptions,
        ...existing,
        ...currentValue
      ]).filter((value) => value && !excludedRenewalTargetClassModeOptions.has(String(value).trim())));
    }

    function renewalTargetClassVersionOptions(record = null) {
      const existing = renewalTargetRecords.map((record) => record.classVersion);
      const currentValue = record ? [record.classVersion] : [];
      return sortRenewalTargetTagValues(
        "classVersion",
        unique([...existing, ...currentValue])
          .filter(Boolean)
          .filter((value) => !excludedRenewalTargetClassVersionOptions.has(String(value).trim()))
      );
    }

    function renewalTargetGradeOptions(record = null) {
      const defaults = Array.from({ length: 12 }, (_, index) => String(index + 1));
      const existing = renewalTargetRecords.map((record) => normalizeIntegerText(record.grade));
      const currentValue = record ? [normalizeIntegerText(record.grade)] : [];
      return sortRenewalTargetTagValues("grade", unique([...defaults, ...existing, ...currentValue]).filter(Boolean));
    }

    function toggleRenewalTargetPicker(groupId, field) {
      const next = { groupId: String(groupId || ""), field: String(field || "") };
      const isSame = openRenewalTargetPicker
        && openRenewalTargetPicker.groupId === next.groupId
        && openRenewalTargetPicker.field === next.field;
      openRenewalTargetPicker = isSame ? null : next;
      closeMonthPicker();
      closeAddRenewalPeriodPicker();
      closeRangePopovers();
      closePeriodPopovers();
      render();
    }

    function closeRenewalTargetPicker(shouldRender = true) {
      if (!openRenewalTargetPicker) return false;
      openRenewalTargetPicker = null;
      if (shouldRender) render();
      return true;
    }

    function isRenewalTargetPickerOpen(groupId, field) {
      return openRenewalTargetPicker
        && openRenewalTargetPicker.groupId === String(groupId || "")
        && openRenewalTargetPicker.field === String(field || "");
    }

    function selectRenewalTargetValue(recordId, field, rawValue) {
      if (!requireEditPermission()) return;
      const record = renewalTargetRecords.find((item) => String(item.id) === String(recordId));
      if (!record) return;
      const value = normalizeRenewalTargetTagValue(field, rawValue);
      if (field !== "classVersion" && !value) return;
      if (
        (field === "classMode" && excludedRenewalTargetClassModeOptions.has(value))
        || (field === "classVersion" && excludedRenewalTargetClassVersionOptions.has(value))
      ) {
        showToast("该选项不可配置");
        return;
      }
      if (hasRenewalTargetRecordConflict(record, field, value)) {
        showToast("该期次下的年级、班型、版本组合已存在");
        return;
      }
      record[field] = value;
      openRenewalTargetPicker = null;
      render();
    }

    function normalizeRenewalTargetTagValue(field, value) {
      if (field === "grade") return normalizeIntegerText(value);
      return String(value ?? "").trim();
    }

    function sortRenewalTargetTagValues(field, values) {
      const cleaned = unique(values.map((value) => normalizeRenewalTargetTagValue(field, value)).filter(Boolean));
      if (field === "grade") return cleaned.sort((a, b) => Number(a) - Number(b));
      return cleaned.sort((a, b) => String(a).localeCompare(String(b), "zh-Hans-CN"));
    }

    function hasRenewalTargetRecordConflict(record, field, value) {
      const nextRecord = {
        ...record,
        [field]: value
      };
      const nextGrade = normalizeIntegerText(nextRecord.grade);
      const nextClassMode = String(nextRecord.classMode ?? "").trim();
      if (!nextGrade || !nextClassMode) return false;
      const nextPeriodIds = renewalTargetPeriodIdsForRecord(nextRecord);
      return renewalTargetRecords.some((record) => {
        if (record.delFlag || String(record.id) === String(nextRecord.id)) return false;
        const sharedPeriodIds = renewalTargetPeriodIdsForRecord(record)
          .filter((periodId) => nextPeriodIds.includes(periodId));
        return sharedPeriodIds.some((periodId) => renewalTargetKey(record, periodId) === renewalTargetKey(nextRecord, periodId));
      });
    }

    function typeControl(record, readonly = false) {
      if (!isConfigTypeModule(record.module)) {
        return '<span class="ghost-value">无</span>';
      }
      const value = normalizeConfigType(record.configType, record.module);
      if (readonly) {
        return `<span>${escapeHtml(value)}</span>`;
      }
      return `
        <select class="select" data-field="configType" aria-label="类型">
          ${configTypeOptions.map((option) => `
            <option value="${escapeAttr(option)}"${option === value ? " selected" : ""}>${escapeHtml(option)}</option>
          `).join("")}
        </select>
      `;
    }

    function periodControl(record, readonly = false) {
      if (isDualPeriodRecord(record)) {
        return `
          <div class="period-pair">
            ${periodSlotControl(record, "period1", "期别1", readonly)}
            ${periodSlotControl(record, "period2", "期别2", readonly)}
          </div>
        `;
      }
      return periodSlotControl(record, "period1", "", readonly);
    }

    function periodSlotControl(record, field, label = "", readonly = false) {
      const compactClass = label ? " compact" : "";
      return `
        <div class="period-picker" data-period-field="${escapeAttr(field)}">
          <button class="period-trigger${compactClass}" type="button"${readonly ? " disabled" : ""}>
            ${label ? `<span class="period-field-label">${escapeHtml(label)}</span>` : ""}
            <span class="period-tags">${periodTagMarkup(record, field)}</span>
          </button>
          <div class="period-popover" hidden>${periodOptionMarkup(record, field, readonly)}</div>
        </div>
      `;
    }

    function periodTagMarkup(record, field = "period1") {
      const selected = periodFieldValues(record, field);
      if (!selected.length) return '<span class="period-placeholder">选择期别</span>';
      return selected
        .map((period) => `<span class="period-tag" title="${escapeAttr(formatPeriodLabel(period))}">${escapeHtml(formatPeriodLabel(period))}</span>`)
        .join("");
    }

    function periodOptionMarkup(record, field = "period1", readonly = false) {
      const selected = periodFieldValues(record, field);
      return periodOptions().map((period) => {
        const selectedClass = selected.includes(period) ? " selected" : "";
        return `
          <button class="period-option${selectedClass}" type="button" data-period="${escapeAttr(period)}" data-period-field="${escapeAttr(field)}"${readonly ? " disabled" : ""}>
            <span class="period-check" aria-hidden="true"></span>
            <span>${escapeHtml(formatPeriodLabel(period))}</span>
          </button>
        `;
      }).join("");
    }

    function periodValues(record) {
      if (!record) return [];
      if (isDualPeriodRecord(record)) {
        return combinedPeriodValues(record.period1, record.period2);
      }
      const storedPeriods = splitPeriods(record.periods);
      return storedPeriods.length ? storedPeriods : splitPeriods(record.period1);
    }

    function periodFieldValues(record, field = "period1") {
      if (!isDualPeriodRecord(record) && field === "period1") {
        return periodValues(record);
      }
      return splitPeriods(record?.[field]).slice(0, 1);
    }

    function combinedPeriodValues(period1, period2 = "") {
      return unique([normalizePeriodValue(period1), normalizePeriodValue(period2)].filter(Boolean)).sort(sortPeriods);
    }

    function normalizedPeriodFields(record, moduleName = "") {
      const dual = isDualPeriodModule(moduleName);
      const rawPeriod1 = splitPeriods(record.period1 ?? record.period_1);
      const rawPeriod2 = splitPeriods(record.period2 ?? record.period_2);
      const fallbackPeriods = splitPeriods(record.periods);
      const normalPeriods = unique([...fallbackPeriods, ...rawPeriod1]).sort(sortPeriods);
      const period1 = rawPeriod1[0] || normalPeriods[0] || "";
      const period2 = dual ? (rawPeriod2[0] || rawPeriod1[1] || fallbackPeriods.find((item) => item !== period1) || "") : "";
      return {
        period1,
        period2,
        periods: dual ? combinedPeriodValues(period1, period2) : normalPeriods
      };
    }

    function isDualPeriodRecord(record) {
      return isDualPeriodModule(record?.module);
    }

    function isDualPeriodModule(moduleName) {
      return dualPeriodModules.has(String(moduleName || "").trim());
    }

    function periodOptions() {
      return unique(remotePeriodOptions).sort(sortPeriods);
    }

    async function loadPeriodOptions() {
      try {
        const data = await postJson(periodOptionsUrl, {});
        const options = normalizePeriodOptions(data);
        if (!options.length) return;
        remotePeriodOptions = options;
        render();
      } catch (error) {
        console.warn("load period options failed", error);
      }
    }

    function normalizePeriodOptions(data) {
      const rows = responseRows(data);
      return unique(rows.map(periodOptionValue).map(normalizePeriodValue)).sort(sortPeriods);
    }

    function unwrapData(data) {
      return data && typeof data === "object" && "data" in data ? data.data : data;
    }

    function responseRows(data) {
      const payload = unwrapData(data);
      return Array.isArray(payload) ? payload : [];
    }

    function periodOptionValue(item) {
      if (typeof item === "string") return item;
      if (!item || typeof item !== "object") return "";
      return item.periodName ?? item.period_name ?? "";
    }

    function splitPeriods(value) {
      if (Array.isArray(value)) {
        return unique(value.flatMap((item) => splitPeriods(item))).sort(sortPeriods);
      }
      return String(value || "")
        .split(/[,，、/]/)
        .map(normalizePeriodValue)
        .filter(Boolean);
    }

    function normalizePeriodValue(value) {
      const text = String(value || "").trim();
      if (!text) return "";
      return text.replace(/^(\d{2})(?=[\u4e00-\u9fa5])/, "20$1");
    }

    function formatPeriodLabel(value) {
      return normalizePeriodValue(value);
    }

    function sortPeriods(a, b) {
      const seasonRank = (value) => {
        const text = normalizePeriodValue(value);
        const year = Number(text.match(/^(\d{4})/)?.[1] || 0);
        const rankMap = { "寒": 1, "春": 2, "暑": 3, "秋": 4 };
        const season = Object.keys(rankMap).find((key) => text.includes(key)) || "";
        const phase = Number(text.match(/(\d+)期/)?.[1] || 0);
        return [year, rankMap[season] || 0, phase, text];
      };
      const left = seasonRank(a);
      const right = seasonRank(b);
      for (let index = 0; index < left.length; index += 1) {
        if (left[index] < right[index]) return 1;
        if (left[index] > right[index]) return -1;
      }
      return 0;
    }

    function unique(values) {
      return [...new Set(values.filter(Boolean))];
    }

    function rangeLabel(record) {
      return `${formatDateSlash(record.timeStart)}～${formatDateSlash(record.timeEnd)}`;
    }

    function rangeLabelMarkup(record) {
      return `
        <span class="range-date">${escapeHtml(formatDateSlash(record.timeStart))}</span>
        <span class="range-separator">～</span>
        <span class="range-date">${escapeHtml(formatDateSlash(record.timeEnd))}</span>
      `;
    }

    function openRangePicker(row, id) {
      const record = records.find((item) => item.id === id);
      if (!record) return;
      const draft = rangeDrafts.get(id) || {
        start: record.timeStart,
        end: record.timeEnd,
        viewMonth: monthKey(record.timeStart || record.configMonth),
        stage: "start"
      };
      draft.start = record.timeStart;
      draft.end = record.timeEnd;
      draft.stage = "start";
      draft.viewMonth = draft.viewMonth || monthKey(record.timeStart || record.configMonth);
      rangeDrafts.set(id, draft);
      refreshRangePicker(row, record);
    }

    function rangeCalendar(record) {
      const draft = rangeDrafts.get(record.id) || {
        start: record.timeStart,
        end: record.timeEnd,
        viewMonth: monthKey(record.timeStart || record.configMonth),
        stage: "start"
      };
      const firstMonth = draft.viewMonth || monthKey(record.timeStart || record.configMonth);
      const endMonth = monthKey(draft.end);
      const secondMonth = draft.stage === "start" && endMonth && endMonth !== firstMonth
        ? endMonth
        : addMonths(firstMonth, 1);
      return `
        <div class="calendar-head">
          <button class="calendar-nav" type="button" data-range-month="-1" aria-label="上个月">‹</button>
          <div class="calendar-title">${escapeHtml(`${formatDateSlash(draft.start)}～${formatDateSlash(draft.end)}`)}</div>
          <button class="calendar-nav" type="button" data-range-month="1" aria-label="下个月">›</button>
        </div>
        <div class="calendar-months">
          ${calendarMonth(firstMonth, draft)}
          ${calendarMonth(secondMonth, draft)}
        </div>
      `;
    }

    function calendarMonth(month, draft) {
      const weekdays = ["日", "一", "二", "三", "四", "五", "六"]
        .map((day) => `<div class="calendar-weekday">${day}</div>`)
        .join("");
      const [year, monthIndex] = month.split("-").map(Number);
      const firstDay = new Date(year, monthIndex - 1, 1).getDay();
      const days = new Date(year, monthIndex, 0).getDate();
      const blanks = Array.from({ length: firstDay }, () => '<div class="calendar-blank"></div>').join("");
      const dayButtons = Array.from({ length: days }, (_, index) => {
        const day = index + 1;
        const value = `${month}-${String(day).padStart(2, "0")}`;
        const inRange = draft.start && draft.end && value >= draft.start && value <= draft.end;
        const isEdge = value === draft.start || value === draft.end;
        const classes = [
          "calendar-day",
          inRange ? "in-range" : "",
          isEdge ? "is-edge" : ""
        ].filter(Boolean).join(" ");
        return `<button class="${classes}" type="button" data-range-date="${value}">${day}</button>`;
      }).join("");
      return `
        <div class="calendar-month">
          <div class="calendar-month-title">${escapeHtml(formatMonthLabel(month))}</div>
          <div class="calendar-weekdays">${weekdays}</div>
          <div class="calendar-days">${blanks}${dayButtons}</div>
        </div>
      `;
    }

    function bindRangeCalendar(row, id) {
      row.querySelectorAll("[data-range-month]").forEach((button) => {
        button.addEventListener("click", () => moveRangeCalendar(id, Number(button.dataset.rangeMonth), row));
      });
      row.querySelectorAll("[data-range-date]").forEach((button) => {
        button.addEventListener("click", () => selectRangeDate(id, button.dataset.rangeDate, row));
      });
    }

    function moveRangeCalendar(id, delta, row) {
      const record = records.find((item) => item.id === id);
      if (!record) return;
      const draft = ensureRangeDraft(record);
      draft.viewMonth = addMonths(draft.viewMonth, delta);
      rangeDrafts.set(id, draft);
      refreshRangePicker(row, record);
    }

    function selectRangeDate(id, value, row) {
      if (!requireEditPermission()) return;
      const record = records.find((item) => item.id === id);
      if (!record) return;
      const draft = ensureRangeDraft(record);
      const shouldComplete = draft.stage === "end" && draft.start;

      if (shouldComplete) {
        const start = value < draft.start ? value : draft.start;
        const end = value < draft.start ? draft.start : value;
        record.timeStart = start;
        record.timeEnd = end;
        draft.start = start;
        draft.end = end;
        draft.stage = "start";
      } else {
        record.timeStart = value;
        record.timeEnd = value;
        draft.start = value;
        draft.end = value;
        draft.stage = "end";
        draft.viewMonth = monthKey(value);
      }

      record.updateBy = operator();
      record.updateDate = nowIso();
      rangeDrafts.set(id, draft);
      refreshRangePicker(row, record);
      if (shouldComplete) row.querySelector(".range-popover").hidden = true;
    }

    function ensureRangeDraft(record) {
      const draft = rangeDrafts.get(record.id) || {
        start: record.timeStart,
        end: record.timeEnd,
        viewMonth: monthKey(record.timeStart || record.configMonth),
        stage: "start"
      };
      draft.viewMonth = draft.viewMonth || monthKey(record.timeStart || record.configMonth);
      return draft;
    }

    function refreshRangePicker(row, record) {
      const popover = row.querySelector(".range-popover");
      if (popover) {
        popover.innerHTML = rangeCalendar(record);
        bindRangeCalendar(row, record.id);
      }
      syncRangeControl(row, record);
    }

    function closeRangePopovers(exceptRow = null) {
      document.querySelectorAll(".range-popover").forEach((popover) => {
        if (!exceptRow || !exceptRow.contains(popover)) popover.hidden = true;
      });
    }

    function closePeriodPopovers(exceptRow = null) {
      document.querySelectorAll(".period-popover").forEach((popover) => {
        if (!exceptRow || !exceptRow.contains(popover)) popover.hidden = true;
      });
    }

    function bindDragHandle(row, id) {
      const dragSources = row.querySelectorAll(".drag-handle, .metric-drag-source");
      if (!dragSources.length) return;

      dragSources.forEach((source) => {
        source.addEventListener("dragstart", (event) => {
          draggingRecordId = id;
          row.classList.add("dragging");
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", String(id));
        });

        source.addEventListener("dragend", () => {
          draggingRecordId = "";
          row.classList.remove("dragging");
          clearDragIndicators();
        });
      });

      row.addEventListener("dragover", (event) => {
        if (draggingTemplateModule) {
          event.preventDefault();
          event.dataTransfer.dropEffect = "copy";
          markDragTarget(row, dragPlacement(event, row));
          return;
        }
        if (!draggingRecordId || draggingRecordId === id) return;
        event.preventDefault();
        event.dataTransfer.dropEffect = "move";
        markDragTarget(row, dragPlacement(event, row));
      });

      row.addEventListener("dragleave", (event) => {
        if (!event.relatedTarget || !row.contains(event.relatedTarget)) {
          clearRowDragState(row);
        }
      });

      row.addEventListener("drop", (event) => {
        if (draggingTemplateModule) {
          event.preventDefault();
          event.stopPropagation();
          addMetricFromTemplate(draggingTemplateModule, id, dragPlacement(event, row));
          return;
        }
        if (!draggingRecordId || draggingRecordId === id) return;
        event.preventDefault();
        event.stopPropagation();
        const sourceId = event.dataTransfer.getData("text/plain") || draggingRecordId;
        moveRecordWithinActiveMonth(sourceId, id, dragPlacement(event, row));
      });
    }

    function bindRenewalTargetDragHandle(row, id) {
      const source = row.querySelector(".renewal-target-drag-handle");
      if (!source) return;

      source.addEventListener("dragstart", (event) => {
        draggingRenewalTargetId = String(id);
        row.classList.add("dragging");
        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/plain", String(id));
      });

      source.addEventListener("dragend", () => {
        draggingRenewalTargetId = "";
        row.classList.remove("dragging");
        clearDragIndicators();
      });

      row.addEventListener("dragover", (event) => {
        if (!draggingRenewalTargetId || draggingRenewalTargetId === String(id)) return;
        event.preventDefault();
        event.dataTransfer.dropEffect = "move";
        markDragTarget(row, dragPlacement(event, row));
      });

      row.addEventListener("dragleave", (event) => {
        if (!event.relatedTarget || !row.contains(event.relatedTarget)) {
          clearRowDragState(row);
        }
      });

      row.addEventListener("drop", (event) => {
        if (!draggingRenewalTargetId || draggingRenewalTargetId === String(id)) return;
        event.preventDefault();
        event.stopPropagation();
        const sourceId = event.dataTransfer.getData("text/plain") || draggingRenewalTargetId;
        moveRenewalTargetWithinActivePeriod(sourceId, id, dragPlacement(event, row));
      });
    }

    function handleMetricWrapDragOver(event) {
      if (!draggingTemplateModule) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = "copy";
      els.metricWrap.classList.add("template-drag-over");
    }

    function handleMetricWrapDragLeave(event) {
      if (event.relatedTarget && els.metricWrap.contains(event.relatedTarget)) return;
      els.metricWrap.classList.remove("template-drag-over");
    }

    function handleMetricWrapDrop(event) {
      if (!draggingTemplateModule) return;
      if (event.target.closest(".metric-row")) return;
      event.preventDefault();
      addMetricFromTemplate(draggingTemplateModule);
    }

    function handleTemplateShelfDragOver(event) {
      if (!draggingRecordId) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = "move";
      els.metricTemplateShelf.classList.add("record-drag-over");
      clearDragIndicators();
    }

    function handleTemplateShelfDragLeave(event) {
      if (event.relatedTarget && els.metricTemplateShelf.contains(event.relatedTarget)) return;
      els.metricTemplateShelf.classList.remove("record-drag-over");
    }

    function handleTemplateShelfDrop(event) {
      if (!draggingRecordId) return;
      event.preventDefault();
      event.stopPropagation();
      deleteRecordToTemplateShelf(draggingRecordId);
    }

    function dragPlacement(event, row) {
      const bounds = rowBounds(row);
      if (!bounds) return "before";
      return event.clientY < bounds.top + bounds.height / 2 ? "before" : "after";
    }

    function rowBounds(row) {
      const rects = [...row.querySelectorAll(".cell")]
        .map((cell) => cell.getBoundingClientRect())
        .filter((rect) => rect.width && rect.height);
      if (!rects.length) return null;
      const top = Math.min(...rects.map((rect) => rect.top));
      const bottom = Math.max(...rects.map((rect) => rect.bottom));
      return { top, bottom, height: bottom - top };
    }

    function markDragTarget(row, placement) {
      clearDragIndicators(row);
      row.classList.toggle("drag-over-before", placement === "before");
      row.classList.toggle("drag-over-after", placement === "after");
    }

    function clearDragIndicators(exceptRow = null) {
      document.querySelectorAll(".metric-row, .renewal-target-row").forEach((row) => {
        if (exceptRow && row === exceptRow) return;
        clearRowDragState(row);
      });
    }

    function clearRowDragState(row) {
      row.classList.remove("drag-over-before", "drag-over-after");
    }

    function moveRecordWithinActiveMonth(sourceId, targetId, placement) {
      if (!requireEditPermission()) return;
      const orderedRows = recordsForActiveMonth();
      const source = orderedRows.find((record) => String(record.id) === String(sourceId));
      if (!source) return;

      const nextRows = orderedRows.filter((record) => String(record.id) !== String(sourceId));
      const targetIndex = nextRows.findIndex((record) => String(record.id) === String(targetId));
      if (targetIndex < 0) return;

      const insertIndex = placement === "after" ? targetIndex + 1 : targetIndex;
      nextRows.splice(insertIndex, 0, source);
      applyMonthRecordOrder(nextRows);
      draggingRecordId = "";
      render();
      showToast("已调整指标顺序");
    }

    function applyMonthRecordOrder(orderedRows) {
      const now = nowIso();
      orderedRows.forEach((record, index) => {
        const nextOrder = index + 1;
        if (record.sortOrder === nextOrder) return;
        record.sortOrder = nextOrder;
        record.updateBy = operator();
        record.updateDate = now;
      });
    }

    function moveRenewalTargetWithinActivePeriod(sourceId, targetId, placement) {
      if (!requireEditPermission()) return;
      const orderedRows = renewalTargetRowsForPeriod();
      const source = orderedRows.find((record) => String(record.id) === String(sourceId));
      if (!source) return;

      const nextRows = orderedRows.filter((record) => String(record.id) !== String(sourceId));
      const targetIndex = nextRows.findIndex((record) => String(record.id) === String(targetId));
      if (targetIndex < 0) return;

      const insertIndex = placement === "after" ? targetIndex + 1 : targetIndex;
      nextRows.splice(insertIndex, 0, source);
      applyRenewalTargetOrder(nextRows);
      draggingRenewalTargetId = "";
      render();
      showToast("已调整目标顺序");
    }

    function updateRecord(id, field, value, sourceElement = null) {
      if (!requireEditPermission()) return;
      const record = records.find((item) => item.id === id);
      if (!record) return;
      const isTimeField = field === "timeStart" || field === "timeEnd";

      record[field] = field === "configType" ? normalizeConfigType(value, record.module) : value;
      if (field === "module") {
        syncRecordPeriods(record);
        record.configType = normalizeConfigType(record.configType, record.module);
      }

      if (field === "timeStart" && record.timeEnd && record.timeEnd < value) {
        record.timeEnd = value;
      }
      if (field === "timeEnd" && record.timeStart && record.timeStart > value) {
        record.timeStart = value;
      }

      record.updateBy = operator();
      record.updateDate = nowIso();
      if (isTimeField) syncRangeControl(sourceElement, record);
    }

    function syncRangeControl(sourceElement, record) {
      const row = sourceElement?.classList?.contains("metric-row")
        ? sourceElement
        : sourceElement?.closest(".metric-row");
      if (!row) return;
      const trigger = row.querySelector(".range-trigger");
      const text = row.querySelector(".range-text");
      const start = row.querySelector('[data-field="timeStart"]');
      const end = row.querySelector('[data-field="timeEnd"]');
      if (text) {
        text.innerHTML = rangeLabelMarkup(record);
        text.title = rangeLabel(record);
      }
      if (!text && trigger) trigger.textContent = rangeLabel(record);
      if (start && start.value !== record.timeStart) start.value = record.timeStart;
      if (end && end.value !== record.timeEnd) end.value = record.timeEnd;
    }

    function selectPeriod(id, field, period, sourceElement = null) {
      if (!requireEditPermission()) return;
      const record = records.find((item) => item.id === id);
      if (!record) return;
      const normalized = normalizePeriodValue(period);
      if (isDualPeriodRecord(record)) {
        const targetField = field === "period2" ? "period2" : "period1";
        record[targetField] = periodFieldValues(record, targetField).includes(normalized) ? "" : normalized;
      } else {
        const selected = periodFieldValues(record, "period1");
        record.periods = selected.includes(normalized)
          ? selected.filter((item) => item !== normalized)
          : [...selected, normalized].sort(sortPeriods);
      }
      syncRecordPeriods(record);
      record.updateBy = operator();
      record.updateDate = nowIso();
      syncPeriodControl(sourceElement, record);
      if (isDualPeriodRecord(record)) {
        sourceElement?.closest(".period-popover")?.setAttribute("hidden", "");
      }
    }

    function syncPeriodControl(sourceElement, record) {
      const row = sourceElement?.closest(".metric-row");
      if (!row) return;
      row.querySelectorAll(".period-picker").forEach((picker) => {
        const field = picker.dataset.periodField || "period1";
        const tags = picker.querySelector(".period-tags");
        const selected = periodFieldValues(record, field);
        if (tags) tags.innerHTML = periodTagMarkup(record, field);
        picker.querySelectorAll("[data-period]").forEach((option) => {
          option.classList.toggle("selected", selected.includes(option.dataset.period));
        });
      });
    }

    function syncRecordPeriods(record) {
      if (!isDualPeriodRecord(record)) {
        const selected = periodFieldValues(record, "period1").sort(sortPeriods);
        record.periods = selected;
        record.period1 = selected[0] || "";
        record.period2 = "";
        return;
      }
      record.period1 = periodFieldValues(record, "period1")[0] || "";
      record.period2 = periodFieldValues(record, "period2")[0] || "";
      record.periods = periodValues(record);
    }

    function addMonth() {
      if (activeModule === renewalTargetModuleKey) {
        toggleAddRenewalPeriodPicker();
        return;
      }
      if (!requireEditPermission()) return;
      const sourceMonth = months[months.length - 1] || activeMonth || "2026-09";
      const next = nextMonth(sourceMonth);
      if (!months.includes(next)) months.push(next);
      months.sort();
      copyMonthRecords(sourceMonth, next);
      activeMonth = next;
      render();
      showToast("已按上个月生成默认配置");
    }

    function copyMonthRecords(sourceMonth, targetMonth) {
      const sourceRows = recordsForMonth(sourceMonth).sort(compareRecordOrder);
      if (!sourceRows.length) {
        return;
      }

      const existing = recordsForMonth(targetMonth);
      if (existing.length) return;

      const now = nowIso();
      const monthDelta = monthOffset(sourceMonth, targetMonth);
      const clones = sourceRows.map((record, index) => ({
        ...record,
        id: makeId(),
        createBy: operator(),
        updateBy: operator(),
        createDate: now,
        updateDate: now,
        configMonth: monthKey(targetMonth),
        timeStart: shiftDate(record.timeStart, monthDelta) || `${targetMonth}-01`,
        timeEnd: shiftDate(record.timeEnd, monthDelta) || endOfMonth(targetMonth),
        period1: periodFieldValues(record, "period1")[0] || "",
        period2: isDualPeriodRecord(record) ? (periodFieldValues(record, "period2")[0] || "") : "",
        periods: periodValues(record),
        configType: normalizeConfigType(record.configType, record.module),
        sortOrder: index + 1,
        delFlag: 0
      }));
      records = [...clones, ...records];
    }

    function addRenewalTargetRow(periodIds = activeRenewalPeriodIds, sourceRecord = null, placement = "top") {
      if (!requireEditPermission()) return;
      const rawPeriodIds = Array.isArray(periodIds) ? periodIds : [periodIds];
      const targetPeriodIds = rawPeriodIds.length === 1 && String(rawPeriodIds[0] || "").includes("+")
        ? normalizeRenewalPeriodGroupIds(rawPeriodIds[0])
        : normalizeRenewalPeriodIds(rawPeriodIds);
      if (!targetPeriodIds.length) {
        showToast("请选择期次");
        return;
      }
      const targetGroupKey = normalizeRenewalPeriodGroupKey(targetPeriodIds);
      const existingRows = renewalTargetRowsForPeriod([targetGroupKey]);
      const source = sourceRecord || (placement === "bottom" ? existingRows[existingRows.length - 1] : null);
      const record = createRenewalTargetRecord(targetPeriodIds, source);
      if (placement === "bottom") {
        renewalTargetRecords.push(record);
        applyRenewalTargetOrder([...existingRows, record]);
      } else {
        renewalTargetRecords.unshift(record);
        applyRenewalTargetOrder([record, ...existingRows]);
      }
      const groupKey = ensureRenewalTargetGroupInFilter(targetPeriodIds);
      activeRenewalPeriodIds = groupKey ? [groupKey] : [];
      activeRenewalPeriodId = groupKey;
      render();
      showToast("已新增目标行");
    }

    function addRenewalTargetRowAfterLast(rows = renewalTargetRowsForPeriod()) {
      const activeOption = renewalTargetPeriodOptionById(activeRenewalPeriodId);
      const targetPeriodIds = activeOption?.periodIds || [];
      if (!targetPeriodIds.length) {
        showToast("请选择期次");
        return;
      }
      const sourceRecord = rows[rows.length - 1] || null;
      addRenewalTargetRow(targetPeriodIds, sourceRecord, "bottom");
    }

    function createRenewalTargetRecord(periodIds = [], sourceRecord = null) {
      const renewalPeriodIds = normalizeRenewalPeriodIds(periodIds);
      const renewalPeriodGroupKey = normalizeRenewalPeriodGroupKey(renewalPeriodIds);
      const source = sourceRecord && !sourceRecord.delFlag ? sourceRecord : null;
      return {
        id: makeId(),
        renewalPeriodIds,
        renewalPeriodId: renewalPeriodIds[0] || "",
        renewalPeriodGroupKey,
        renewalPeriodName: renewalTargetPeriodLabel(renewalPeriodIds[0]),
        grade: source?.grade || "",
        classMode: source?.classMode || "",
        classVersion: source?.classVersion || "",
        allRate: source?.allRate || "",
        sRate: source?.sRate || "",
        aRate: source?.aRate || "",
        bRate: source?.bRate || "",
        cRate: source?.cRate || "",
        dRate: source?.dRate || "",
        sortOrder: 0,
        delFlag: 0,
        originalRenewalPeriodIds: [],
        originalRenewalPeriodId: "",
        originalRenewalPeriodGroupKey: "",
        originalGrade: "",
        originalClassMode: "",
        originalClassVersion: "",
        originalKey: ""
      };
    }

    function addMetric() {
      if (!requireEditPermission()) return;
      const firstAvailable = metricTemplates().find((template) => {
        return !recordsForActiveMonth().some((record) => record.module.trim() === template.module);
      });
      if (!firstAvailable) {
        showToast("当前月份已添加全部指标");
        return;
      }
      addMetricFromTemplate(firstAvailable.module);
    }

    function addMetricFromTemplate(moduleName, targetId = "", placement = "after") {
      if (!requireEditPermission()) return;
      const module = String(moduleName || "").trim();
      if (!module) return;
      if (recordsForActiveMonth().some((record) => record.module.trim() === module)) {
        showToast("当前月份已存在该指标");
        return;
      }

      const record = createRecord(activeMonth, module);
      records.push(record);
      if (!months.includes(activeMonth)) {
        months.push(activeMonth);
        months.sort();
      }

      const nextRows = recordsForActiveMonth().filter((item) => item.id !== record.id);
      const targetIndex = nextRows.findIndex((item) => String(item.id) === String(targetId));
      if (targetIndex < 0) {
        nextRows.push(record);
      } else {
        nextRows.splice(placement === "after" ? targetIndex + 1 : targetIndex, 0, record);
      }
      applyMonthRecordOrder(nextRows);
      draggingTemplateModule = "";
      els.metricWrap.classList.remove("template-drag-over");
      clearDragIndicators();
      render();
      showToast("已添加指标");
    }

    function softDeleteRecord(id) {
      if (!requireEditPermission()) return;
      const record = records.find((item) => item.id === id);
      if (!record) return;
      record.delFlag = 1;
      record.updateBy = operator();
      record.updateDate = nowIso();
      normalizeMonthSortOrders(records, activeMonth);
      render();
      showToast("已逻辑删除指标");
    }

    function deleteRecordToTemplateShelf(id) {
      if (!requireEditPermission()) return;
      const record = records.find((item) => String(item.id) === String(id));
      if (!record) return;
      record.delFlag = 1;
      record.updateBy = operator();
      record.updateDate = nowIso();
      draggingRecordId = "";
      draggingTemplateModule = "";
      els.metricTemplateShelf.classList.remove("record-drag-over");
      els.metricWrap.classList.remove("template-drag-over");
      clearDragIndicators();
      normalizeMonthSortOrders(records, activeMonth);
      render();
      showToast("已移回指标库");
    }

    function softDeleteRenewalTargetRecord(recordId) {
      if (!requireEditPermission()) return;
      const record = renewalTargetRecords.find((item) => String(item.id) === String(recordId));
      if (!record) return;
      record.delFlag = 1;
      render();
      showToast("已标记删除，保存后生效");
    }

    function createRecord(month, moduleName = "") {
      const now = nowIso();
      const configMonth = monthKey(month);
      const module = String(moduleName || "").trim() || nextMetricName(month);
      const template = moduleName ? templateRecordForModule(module, configMonth) : null;
      const monthDelta = template ? monthOffset(template.configMonth, configMonth) : 0;
      const record = {
        id: makeId(),
        createBy: operator(),
        updateBy: operator(),
        createDate: now,
        updateDate: now,
        configMonth,
        module,
        content: template?.content || previousContentForModule(month, module) || "",
        timeStart: shiftDate(template?.timeStart, monthDelta) || `${configMonth}-01`,
        timeEnd: shiftDate(template?.timeEnd, monthDelta) || endOfMonth(configMonth),
        period1: template ? (periodFieldValues(template, "period1")[0] || "") : "",
        period2: template && isDualPeriodModule(module) ? (periodFieldValues(template, "period2")[0] || "") : "",
        periods: template ? periodValues(template) : [],
        configType: isConfigTypeModule(module) ? normalizeConfigType(template?.configType, module) : "",
        sortOrder: 1,
        delFlag: 0
      };
      syncRecordPeriods(record);
      return record;
    }

    function templateRecordForModule(moduleName, targetMonth) {
      const module = String(moduleName || "").trim();
      const target = monthKey(targetMonth);
      const candidates = records
        .filter((record) => !record.delFlag && record.module.trim() === module)
        .sort((a, b) => {
          const left = monthKey(a.configMonth);
          const right = monthKey(b.configMonth);
          const leftFuture = left > target ? 1 : 0;
          const rightFuture = right > target ? 1 : 0;
          if (leftFuture !== rightFuture) return leftFuture - rightFuture;
          return leftFuture ? left.localeCompare(right) : right.localeCompare(left);
        });
      return candidates[0] || null;
    }

    function recordsForActiveMonth() {
      return recordsForMonth(activeMonth)
        .sort(compareRecordOrder);
    }

    function recordsForMonth(month) {
      return records.filter((record) => monthKey(record.configMonth) === monthKey(month) && !record.delFlag);
    }

    function compareRenewalTargetRecordOrder(a, b) {
      const byOrder = renewalTargetOrderValue(a) - renewalTargetOrderValue(b);
      if (byOrder) return byOrder;
      const byGrade = Number(a.grade || 0) - Number(b.grade || 0);
      if (byGrade) return byGrade;
      const byMode = String(a.classMode || "").localeCompare(String(b.classMode || ""), "zh-Hans-CN");
      if (byMode) return byMode;
      return String(a.classVersion || "").localeCompare(String(b.classVersion || ""), "zh-Hans-CN");
    }

    function renewalTargetOrderValue(record) {
      return normalizeSortOrder(record?.sortOrder) || Number.MAX_SAFE_INTEGER;
    }

    function renewalTargetRowsForPeriod(periodIds = activeRenewalPeriodIds) {
      const targetGroupKeys = (Array.isArray(periodIds) ? periodIds : (periodIds ? [periodIds] : activeRenewalPeriodIds))
        .map((value) => normalizeRenewalPeriodGroupKey(value))
        .filter(Boolean);
      const targetGroupSet = new Set(targetGroupKeys);
      return renewalTargetRecords
        .filter((record) => !record.delFlag)
        .filter((record) => {
          return !targetGroupSet.size || targetGroupSet.has(renewalTargetGroupKeyForRecord(record));
        })
        .sort(compareRenewalTargetRecordOrder);
    }

    function applyRenewalTargetOrder(orderedRows) {
      const now = nowIso();
      orderedRows.forEach((record, index) => {
        const nextOrder = index + 1;
        if (record.sortOrder === nextOrder) return;
        record.sortOrder = nextOrder;
        record.updateBy = operator();
        record.updateDate = now;
      });
    }

    function updateRenewalTargetRecord(recordId, field, value) {
      if (!requireEditPermission()) return;
      const record = renewalTargetRecords.find((item) => String(item.id) === String(recordId));
      if (!record || !(field in record)) return;
      const isRateField = renewalTargetRateFields.some((item) => item.key === field);
      record[field] = isRateField ? normalizeRateValue(value) : String(value ?? "").trim();
    }

    function previousContentForModule(month, moduleName) {
      const target = monthKey(month);
      const candidates = records
        .filter((record) => !record.delFlag && monthKey(record.configMonth) < target && record.content.trim())
        .filter((record) => !moduleName || record.module === moduleName)
        .sort((a, b) => monthKey(b.configMonth).localeCompare(monthKey(a.configMonth)));
      return candidates[0]?.content || "";
    }

    async function saveAll() {
      if (activeModule === renewalTargetModuleKey) {
        await saveRenewalTargets();
        return;
      }
      if (!requireEditPermission()) return;
      const invalid = recordsForActiveMonth().find((record) => {
        return !record.module.trim() || !record.timeStart || !record.timeEnd || record.timeStart > record.timeEnd;
      });

      if (invalid) {
        showToast("请检查指标名称和时间范围");
        return;
      }

      const now = nowIso();
      normalizeMonthSortOrders(records, activeMonth);
      records.forEach((record) => {
        if (monthKey(record.configMonth) === activeMonth && !record.delFlag) {
          if (!record.createBy) record.createBy = operator();
          if (!record.createDate) record.createDate = now;
          record.updateBy = operator();
          record.updateDate = now;
          record.configMonth = monthKey(activeMonth);
          syncRecordPeriods(record);
        }
      });
      render();

      try {
        await postJson(`${apiBase}/batchUpsert`, apiRows(activeMonth));
        showToast("已保存当前月到数据库");
      } catch (error) {
        console.error(error);
        showToast("保存接口失败，请检查后端连接");
      }
    }

    async function saveRenewalTargets() {
      if (!requireEditPermission()) return;
      const activeRows = renewalTargetRecords.filter((record) => !record.delFlag);
      const invalid = activeRows.find((record) => {
        return !renewalTargetPeriodIdsForRecord(record).length
          || !normalizeIntegerText(record.grade)
          || !record.classMode.trim();
      });
      if (invalid) {
        showToast("请检查续报期ID、年级和班型");
        return;
      }

      if (hasDuplicateRenewalTargetKeys(activeRows)) {
        showToast("续报目标存在重复行，请检查期次、年级、班型、版本");
        return;
      }

      try {
        await postJson(`${apiBase}/batchUpsert`, {
          moduleKey: renewalTargetModuleKey,
          rows: renewalTargetApiRows()
        });
        showToast("已保存续报目标");
        await loadRenewalTargetRows();
      } catch (error) {
        console.error(error);
        showToast("续报目标保存失败，请检查后端连接");
      }
    }

    function hasDuplicateRenewalTargetKeys(rows) {
      const seen = new Set();
      return rows.some((record) => {
        return renewalTargetPeriodIdsForRecord(record).some((periodId) => {
          const key = renewalTargetKey(record, periodId);
          if (seen.has(key)) return true;
          seen.add(key);
          return false;
        });
      });
    }

    function apiRows(month = null) {
      const source = month
        ? records.filter((record) => monthKey(record.configMonth) === monthKey(month))
        : records;
      return source.map((record) => ({
        id: backendId(record.id),
        createBy: record.createBy || null,
        updateBy: record.updateBy || null,
        createDate: record.createDate || null,
        updateDate: record.updateDate || null,
        configMonth: monthKey(record.configMonth),
        module: record.module,
        content: record.content,
        timeStart: record.timeStart,
        timeEnd: record.timeEnd,
        period1: periodFieldValues(record, "period1")[0] || "",
        period2: isDualPeriodRecord(record) ? (periodFieldValues(record, "period2")[0] || "") : "",
        periods: periodValues(record),
        configType: normalizeConfigType(record.configType, record.module),
        sortOrder: normalizeSortOrder(record.sortOrder) || 0,
        delFlag: Number(record.delFlag || 0)
      }));
    }

    function renewalTargetApiRows() {
      const rows = [];
      renewalTargetRecords.forEach((record) => {
        const currentPeriodIds = renewalTargetPeriodIdsForRecord(record);
        const originalPeriodIds = renewalTargetOriginalPeriodIdsForRecord(record);
        const currentPeriodGroupKey = renewalTargetGroupKeyForRecord(record);
        const originalPeriodGroupKey = renewalTargetOriginalGroupKeyForRecord(record);
        const currentPeriodSet = new Set(currentPeriodIds);
        const base = {
          grade: normalizeIntegerText(record.grade),
          classMode: record.classMode,
          classVersion: record.classVersion,
          allRate: ratePayloadValue(record.allRate),
          sRate: ratePayloadValue(record.sRate),
          aRate: ratePayloadValue(record.aRate),
          bRate: ratePayloadValue(record.bRate),
          cRate: ratePayloadValue(record.cRate),
          dRate: ratePayloadValue(record.dRate),
          renewalPeriodGroupKey: currentPeriodGroupKey,
          originalRenewalPeriodGroupKey: originalPeriodGroupKey,
          sortOrder: normalizeSortOrder(record.sortOrder) || 0,
          originalGrade: normalizeIntegerText(record.originalGrade),
          originalClassMode: record.originalClassMode,
          originalClassVersion: record.originalClassVersion
        };

        if (record.delFlag) {
          originalPeriodIds.forEach((periodId) => {
            rows.push({
              ...base,
              renewalPeriodId: periodId,
              originalRenewalPeriodId: periodId,
              delFlag: 1
            });
          });
          return;
        }

        if (!record.delFlag) {
          currentPeriodIds.forEach((periodId) => {
            const keepsExistingRow = originalPeriodIds.includes(periodId);
            rows.push({
              ...base,
              renewalPeriodId: periodId,
              originalRenewalPeriodId: keepsExistingRow ? periodId : "",
              delFlag: 0
            });
          });
        }

        originalPeriodIds
          .filter((periodId) => !currentPeriodSet.has(periodId))
          .forEach((periodId) => {
            rows.push({
              ...base,
              renewalPeriodId: periodId,
              originalRenewalPeriodId: periodId,
              originalGrade: normalizeIntegerText(record.originalGrade),
              originalClassMode: record.originalClassMode,
              originalClassVersion: record.originalClassVersion,
              delFlag: 1
            });
          });
      });
      return rows;
    }

    function ratePayloadValue(value) {
      const text = String(value ?? "").trim();
      return text ? text : null;
    }

    function backendId(value) {
      const text = String(value ?? "").trim();
      if (!/^\d+$/.test(text)) return null;
      const number = Number(text);
      return Number.isSafeInteger(number) ? number : text;
    }

    function operator() {
      return currentAdminId() || "";
    }

    async function postJson(url, body) {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify(body)
      });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      return response.headers.get("content-type")?.includes("application/json")
        ? response.json()
        : response.text();
    }

    function nextMetricName(month) {
      const used = new Set(recordsForMonth(month).map((record) => record.module));
      if (!used.has("新指标")) return "新指标";
      let index = 2;
      while (used.has(`新指标${index}`)) index += 1;
      return `新指标${index}`;
    }

    function nextMonth(month) {
      return addMonths(month, 1);
    }

    function addMonths(month, delta) {
      const [year, monthIndex] = monthKey(month).split("-").map(Number);
      const date = new Date(year, monthIndex - 1 + delta, 1);
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
    }

    function endOfMonth(month) {
      const [year, monthIndex] = monthKey(month).split("-").map(Number);
      const date = new Date(year, monthIndex, 0);
      return `${year}-${String(monthIndex).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    }

    function monthOffset(fromMonth, toMonth) {
      const [fromYear, fromIndex] = monthKey(fromMonth).split("-").map(Number);
      const [toYear, toIndex] = monthKey(toMonth).split("-").map(Number);
      return (toYear - fromYear) * 12 + toIndex - fromIndex;
    }

    function shiftDate(value, monthDelta) {
      const dateText = normalizeDate(value);
      if (!dateText) return "";
      const [year, month, day] = dateText.split("-").map(Number);
      const shifted = new Date(year, month - 1 + monthDelta, day);
      return `${shifted.getFullYear()}-${String(shifted.getMonth() + 1).padStart(2, "0")}-${String(shifted.getDate()).padStart(2, "0")}`;
    }

    function defaultConfigMonth() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
    }

    function monthKey(value) {
      if (!value) return "";
      const text = String(value);
      const match = text.match(/^(\d{4})-(\d{2})/);
      return match ? `${match[1]}-${match[2]}` : text;
    }

    function formatMonthLabel(value) {
      const key = monthKey(value);
      if (!/^\d{4}-\d{2}$/.test(key)) return key || "-";
      const [year, month] = key.split("-");
      return `${year}年${month}月`;
    }

    function normalizeDate(value) {
      if (!value) return "";
      if (value instanceof Date && !Number.isNaN(value.getTime())) return value.toISOString().slice(0, 10);
      const text = String(value);
      const match = text.match(/^(\d{4})-(\d{2})-(\d{2})/);
      return match ? `${match[1]}-${match[2]}-${match[3]}` : text;
    }

    function formatDateSlash(value) {
      return normalizeDate(value).replaceAll("-", "/");
    }

    function normalizeDateTime(value) {
      if (!value) return "";
      if (value instanceof Date && !Number.isNaN(value.getTime())) return value.toISOString();
      return String(value);
    }

    function nowIso() {
      return new Date().toISOString();
    }

    function makeId() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") return window.crypto.randomUUID();
      return `local-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll("\n", "&#10;");
    }

    let toastTimer = null;
    function showToast(message) {
      clearTimeout(toastTimer);
      els.toast.textContent = message;
      els.toast.classList.add("show");
      toastTimer = setTimeout(() => els.toast.classList.remove("show"), 1800);
    }

    els.addMonthBtn.addEventListener("click", (event) => {
      event.stopPropagation();
      addMonth();
    });
    if (els.addMetricBtn) els.addMetricBtn.addEventListener("click", addMetric);
    els.monthFilter.addEventListener("click", (event) => {
      event.stopPropagation();
      toggleMonthPicker();
    });
    els.monthFilterPopover.addEventListener("click", (event) => {
      event.stopPropagation();
    });
    els.addRenewalPeriodPopover.addEventListener("click", (event) => {
      event.stopPropagation();
    });
    els.saveBtn.addEventListener("click", saveAll);
    els.metricTemplateShelf.addEventListener("dragover", handleTemplateShelfDragOver);
    els.metricTemplateShelf.addEventListener("dragleave", handleTemplateShelfDragLeave);
    els.metricTemplateShelf.addEventListener("drop", handleTemplateShelfDrop);
    els.metricWrap.addEventListener("dragover", handleMetricWrapDragOver);
    els.metricWrap.addEventListener("dragleave", handleMetricWrapDragLeave);
    els.metricWrap.addEventListener("drop", handleMetricWrapDrop);
    document.addEventListener("click", () => {
      closeMonthPicker();
      closeAddRenewalPeriodPicker();
      const shouldRender = closeRenewalTargetPicker(false);
      closeRangePopovers();
      closePeriodPopovers();
      if (shouldRender) render();
    });

    window.PERFORMANCE_CONFIGURATION_API_BASE = apiBase;
    window.getPerformanceConfigurationPermissionState = resolvePermissionState;
    window.reloadPerformanceConfigurationRows = loadConfigurationRows;
    window.reloadRenewalTargetRows = loadRenewalTargetRows;
    window.reloadPerformanceConfigurationPeriodOptions = loadPeriodOptions;
    window.getPerformanceConfigurationRows = apiRows;
    window.getRenewalTargetRows = renewalTargetApiRows;

    boot();
  </script>
</body>
</html>
