<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>绩效配置</title>
  <style>
    :root {
      --page: #f5f7fa;
      --surface: #ffffff;
      --surface-soft: #fafbfc;
      --text: #2f3742;
      --muted: #74808d;
      --line: #dfe5ec;
      --line-strong: #cbd5df;
      --accent: #bf7f2f;
      --accent-dark: #9f6826;
      --accent-soft: #fff8ed;
      --danger: #b42318;
      --danger-soft: #fff1ef;
      --shadow: 0 14px 32px rgba(41, 52, 64, 0.08);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page);
      color: var(--text);
      font-size: 14px;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      min-height: 88px;
      padding: 26px 40px;
      border-bottom: 1px solid var(--line);
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 20px;
    }

    h1,
    h2,
    h3 {
      margin: 0;
      letter-spacing: 0;
    }

    h1 {
      font-size: 30px;
      line-height: 1.2;
      font-weight: 800;
    }

    .button {
      min-height: 38px;
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #ffffff;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      white-space: nowrap;
      font-weight: 650;
    }

    .button:hover {
      border-color: var(--line-strong);
      background: #fafbfc;
    }

    .button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    .button.primary:hover {
      border-color: var(--accent-dark);
      background: var(--accent-dark);
    }

    .button svg {
      width: 17px;
      height: 17px;
      stroke-width: 2.3;
    }

    .button[hidden] {
      display: none;
    }

    .button:disabled,
    .drag-handle:disabled,
    .module-tab:disabled,
    .month-select:disabled,
    .range-trigger:disabled,
    .period-trigger:disabled,
    .period-option:disabled,
    .calendar-nav:disabled,
    .calendar-day:disabled {
      cursor: not-allowed;
      opacity: 0.58;
    }

    .workspace {
      min-height: calc(100vh - 88px);
      padding: 28px 24px 40px;
    }

    .board {
      min-height: calc(100vh - 156px);
      display: grid;
      grid-template-columns: 204px minmax(0, 1fr);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .month-sidebar {
      min-width: 0;
      border-right: 1px solid var(--line);
      background: #f9fafb;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .side-head {
      min-height: 118px;
      padding: 18px 16px;
      border-bottom: 1px solid var(--line);
      display: grid;
      align-content: center;
      gap: 12px;
    }

    .side-head h2 {
      font-size: 22px;
      line-height: 1.25;
      font-weight: 800;
    }

    .side-head .button {
      width: 100%;
    }

    .module-list {
      padding: 14px;
      display: grid;
      align-content: start;
      gap: 9px;
      overflow: auto;
    }

    .module-item {
      min-width: 0;
      position: relative;
    }

    .module-tab {
      width: 100%;
      min-height: 48px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #ffffff;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      font-size: 16px;
      font-weight: 750;
      text-align: left;
      white-space: nowrap;
    }

    .module-tab:hover {
      border-color: var(--line-strong);
      background: #ffffff;
    }

    .module-tab.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .module-tab.is-disabled {
      color: #94a3b8;
      cursor: default;
      opacity: 0.58;
    }

    .module-tab.is-disabled:hover {
      border-color: var(--line);
      color: #94a3b8;
    }

    .main {
      min-width: 0;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      background: #ffffff;
    }

    .main-head {
      min-height: 74px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: #ffffff;
    }

    .main-actions {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .month-controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .month-filter {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
      white-space: nowrap;
    }

    .month-picker {
      min-width: 0;
      position: relative;
      max-width: min(520px, calc(100vw - 220px));
    }

    .month-select {
      min-width: 148px;
      min-height: 38px;
      padding: 7px 34px 7px 11px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #ffffff;
      color: var(--text);
      outline: none;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      max-width: 100%;
      text-align: left;
    }

    #monthFilterLabel {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .month-select:hover {
      border-color: var(--line-strong);
    }

    .month-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(191, 127, 47, 0.13);
    }

    .month-caret {
      flex: 0 0 auto;
      width: 8px;
      height: 8px;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(45deg) translateY(-2px);
    }

    .month-select[aria-expanded="true"] .month-caret {
      transform: rotate(225deg) translateY(-1px);
    }

    .month-popover {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      z-index: 20;
      width: min(320px, calc(100vw - 48px));
      max-height: 318px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      box-shadow: var(--shadow);
      overflow: auto;
      display: grid;
      gap: 12px;
    }

    .month-popover.renewal-target-period-popover {
      width: min(440px, calc(100vw - 48px));
    }

    .month-popover[hidden] {
      display: none;
    }

    .month-year-group {
      display: grid;
      gap: 8px;
    }

    .month-year-title {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.2;
    }

    .month-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    .month-option {
      min-height: 34px;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #ffffff;
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      font-weight: 750;
      white-space: nowrap;
    }

    .month-option:hover,
    .month-option:focus {
      border-color: var(--accent);
      color: var(--accent);
      outline: none;
    }

    .month-option.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .renewal-target-period-group .month-grid {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .renewal-target-period-group .month-option {
      width: 100%;
      min-height: 38px;
      padding: 9px 10px;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
      text-align: left;
      line-height: 1.35;
      white-space: normal;
    }

    .renewal-target-period-group .month-option:last-child {
      border-bottom: 0;
    }

    .renewal-target-period-group .month-option:hover,
    .renewal-target-period-group .month-option:focus,
    .renewal-target-period-group .month-option.active {
      border-color: var(--line);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .icon-button {
      flex: 0 0 40px;
      width: 40px;
      min-width: 40px;
      padding: 0;
      justify-content: center;
      font-size: 22px;
      line-height: 1;
    }

    .add-renewal-target-control {
      position: relative;
      display: inline-flex;
    }

    .add-renewal-period-popover {
      left: auto;
      right: 0;
      width: 360px;
      max-height: 360px;
      padding: 0;
      overflow: hidden;
      display: block;
    }

    .add-renewal-period-popover[hidden] {
      display: none;
    }

    .renewal-add-period-panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      max-height: 360px;
      background: #ffffff;
    }

    .renewal-add-period-title {
      width: 100%;
      min-height: 42px;
      padding: 10px 12px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
      color: var(--muted);
      overflow: hidden;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 750;
    }

    .renewal-add-period-list {
      min-height: 0;
      max-height: 270px;
      padding: 6px;
      overflow: auto;
      display: grid;
      gap: 2px;
    }

    .renewal-add-period-confirm {
      width: calc(100% - 24px);
      margin: 8px 12px 12px;
    }

    .renewal-add-period-option {
      width: 100%;
      min-height: 34px;
      padding: 7px 8px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      overflow: hidden;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 750;
    }

    .renewal-add-period-option:hover,
    .renewal-add-period-option:focus {
      background: #f8fafc;
      color: var(--accent);
      outline: none;
    }

    .renewal-add-period-option.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .metric-template-shelf {
      min-width: 0;
      padding: 14px 24px 16px;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
      display: grid;
      gap: 10px;
    }

    .metric-template-shelf[hidden] {
      display: none;
    }

    .metric-template-shelf.record-drag-over {
      background: #fff8ed;
      box-shadow: inset 0 -2px 0 var(--accent);
    }

    .template-shelf-title {
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
    }

    .template-chip-list {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .metric-template-chip {
      min-height: 34px;
      padding: 6px 11px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #ffffff;
      color: var(--text);
      cursor: grab;
      font-size: 13px;
      font-weight: 750;
      white-space: nowrap;
    }

    .metric-template-chip:hover,
    .metric-template-chip:focus {
      border-color: var(--accent);
      color: var(--accent);
      outline: none;
    }

    .metric-template-chip:active {
      cursor: grabbing;
    }

    .metric-template-chip.is-used {
      border-color: #d6e0eb;
      background: #f7fafc;
      color: #94a3b8;
      cursor: not-allowed;
    }

    .metric-wrap {
      min-width: 0;
      overflow: auto;
      background: #ffffff;
    }

    .metric-wrap.template-drag-over {
      background: #fffbf5;
    }

    .metric-table {
      min-width: 942px;
      display: grid;
      grid-template-columns: 184px 156px 68px 274px minmax(260px, 1fr);
    }

    .renewal-target-table {
      min-width: 1144px;
      display: grid;
      grid-template-columns: 154px 170px 180px repeat(6, minmax(86px, 1fr)) 72px;
    }

    .table-head,
    .metric-row,
    .renewal-target-row {
      display: contents;
    }

    .table-head > div {
      position: sticky;
      top: 0;
      z-index: 1;
      min-height: 44px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: #f9fafb;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
    }

    .cell {
      min-width: 0;
      padding: 10px;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    .metric-name-cell {
      align-items: center;
    }

    .drag-handle {
      flex: 0 0 26px;
      width: 26px;
      height: 34px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: #94a3b8;
      cursor: grab;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .drag-handle[hidden] {
      display: none;
    }

    .drag-handle:hover,
    .drag-handle:focus {
      border-color: var(--line);
      background: #f8fafc;
      color: var(--accent);
      outline: none;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .drag-grip {
      width: 14px;
      height: 20px;
      background-image: radial-gradient(circle, currentColor 1.35px, transparent 1.5px);
      background-position: center;
      background-size: 7px 7px;
    }

    .metric-row.dragging .cell {
      opacity: 0.52;
    }

    .metric-row.drag-over-before .cell {
      box-shadow: inset 0 2px 0 var(--accent);
    }

    .metric-row.drag-over-after .cell {
      box-shadow: inset 0 -2px 0 var(--accent);
    }

    .metric-row:nth-child(odd) .cell {
      background: var(--surface-soft);
    }

    .renewal-target-row:nth-child(odd) .cell {
      background: var(--surface-soft);
    }

    .renewal-target-grade-cell {
      gap: 4px;
    }

    .renewal-target-grade-cell .renewal-tag-picker {
      width: auto;
      flex: 1 1 auto;
      min-width: 0;
    }

    .renewal-target-drag-handle {
      flex-basis: 24px;
      width: 24px;
    }

    .renewal-target-row.dragging .cell {
      opacity: 0.52;
    }

    .renewal-target-row.drag-over-before .cell {
      box-shadow: inset 0 2px 0 var(--accent);
    }

    .renewal-target-row.drag-over-after .cell {
      box-shadow: inset 0 -2px 0 var(--accent);
    }

    .renewal-target-add-row {
      grid-column: 1 / -1;
      min-height: 58px;
      padding: 10px 12px;
      border-top: 1px solid var(--line);
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .renewal-target-add-button {
      width: 38px;
      height: 34px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #ffffff;
      color: var(--muted);
      cursor: pointer;
      font-size: 22px;
      line-height: 1;
    }

    .renewal-target-add-button:hover,
    .renewal-target-add-button:focus {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
      outline: none;
    }

    .renewal-target-table > .table-head > div {
      padding-inline: 10px;
    }

    .renewal-target-table:not(.is-readonly) > .table-head > div:first-child {
      padding-left: 38px;
    }

    .renewal-target-table.is-readonly > .table-head > div:first-child {
      padding-left: 10px;
    }

    .metric-table:not(.is-readonly) > .table-head > div:first-child {
      padding-left: 44px;
    }

    .metric-table.is-readonly > .table-head > div:first-child {
      padding-left: 14px;
    }

    .metric-input {
      width: 100%;
      flex: 1 1 auto;
      min-height: 40px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--accent);
      outline: none;
      font-size: 15px;
      line-height: 1.25;
      font-weight: 750;
      min-width: 0;
    }

    .metric-drag-source {
      cursor: grab;
    }

    .metric-drag-source:focus {
      cursor: text;
    }

    .metric-input:focus {
      border-bottom-color: var(--accent);
    }

    .metric-input:read-only {
      color: var(--text);
      border-bottom-color: transparent;
    }

    .metric-name-text {
      min-width: 0;
      flex: 1 1 auto;
      color: var(--accent);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 15px;
      line-height: 1.25;
      font-weight: 750;
    }

    .input,
    .select,
    .textarea {
      width: 100%;
      min-height: 38px;
      padding: 7px 9px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #ffffff;
      color: var(--text);
      outline: none;
    }

    .input:focus,
    .select:focus,
    .textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(191, 127, 47, 0.13);
    }

    .input:read-only,
    .select:disabled,
    .textarea:read-only {
      color: var(--text);
      background: #f8fafc;
      box-shadow: none;
    }

    .select {
      appearance: none;
      padding-right: 28px;
      background-image: linear-gradient(45deg, transparent 50%, #74808d 50%), linear-gradient(135deg, #74808d 50%, transparent 50%);
      background-position: calc(100% - 15px) 16px, calc(100% - 10px) 16px;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }

    .ghost-value {
      color: #a1aab4;
      font-size: 13px;
    }

    .renewal-tag-picker {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }

    .renewal-tag-trigger {
      width: auto;
      max-width: 100%;
      min-height: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      text-align: left;
      position: relative;
    }

    .renewal-tag-trigger:hover,
    .renewal-tag-trigger:focus {
      outline: none;
    }

    .renewal-tag-trigger:disabled {
      cursor: default;
    }

    .renewal-selected-tags {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .renewal-selected-tag {
      max-width: 100%;
      min-height: 28px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 650;
    }

    .renewal-tag-trigger:hover .renewal-selected-tag,
    .renewal-tag-trigger:focus .renewal-selected-tag {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .renewal-tag-placeholder {
      min-height: 28px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #a1aab4;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 550;
    }

    .renewal-tag-placeholder.is-empty {
      color: #aab3bd;
      font-weight: 500;
    }

    .renewal-tag-popover {
      position: absolute;
      top: 44px;
      left: 0;
      z-index: 8;
      width: 236px;
      max-height: 270px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      box-shadow: var(--shadow);
      display: grid;
      gap: 8px;
      overflow: auto;
    }

    .renewal-tag-popover[hidden] {
      display: none;
    }

    .renewal-tag-clear {
      min-height: 30px;
      padding: 5px 8px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      text-align: left;
      font-size: 12px;
      font-weight: 750;
    }

    .renewal-tag-clear:hover,
    .renewal-tag-clear:focus {
      background: #f8fafc;
      color: var(--accent);
      outline: none;
    }

    .renewal-tag-options {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .renewal-tag-option {
      width: 100%;
      max-width: 100%;
      min-height: 32px;
      padding: 6px 8px;
      border: 0;
      border-radius: 6px;
      background: transparent;

    .renewal-tag-option:hover,

    .row-action-button {

    .period-picker {

    .period-pair {

    .period-trigger.compact {

    .period-field-label {

    .period-trigger {

    .period-tag {

      text-overflow: ellipsis;

    .period-placeholder {

    .period-popover {
      position: absolute;
      top: 44px;
      left: 0;

    .period-option {

      border: 1px solid transparent;
      border-radius: 7px;
      background: #ffffff;
      color: var(--text);
      cursor: pointer;

    .period-check {

      background: #ffffff;

    }

    .period-option.selected .period-check {
      border-color: var(--accent);

    .period-option.selected .period-check::after {
      content: "";

      transform: rotate(45deg);

    }

    .period-option.selected {

    .range-trigger {

    .range-trigger:hover,

    }

    .range-popover {
      position: absolute;

      border-radius: 8px;

      color: #ffffff;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;

    @media (max-width: 900px) {
      .topbar {
        padding: 22px;

      .workspace {
        padding: 18px;

      .board {

      .side-head .button {

      .metric-template-shelf {

      .module-list {

        grid-template-columns: repeat(auto-fit, minmax(154px, 1fr));
        gap: 8px;
        padding: 10px 14px 12px;
        max-height: 150px;
        overflow-x: hidden;
        overflow-y: auto;
        align-content: unset;
        scrollbar-width: thin;
      }

      .module-item {
        min-width: 0;
      }

      .module-tab {
        width: 100%;
        min-width: 0;
        min-height: 40px;
        padding: 0 10px;
        justify-content: center;
        font-size: 14px;
      }

      .metric-table {
        min-width: 892px;
        grid-template-columns: 176px 140px 64px 246px minmax(210px, 1fr);
      }

      .range-popover {
        width: min(470px, calc(100vw - 72px));

    @media (max-width: 560px) {
      .topbar,
      .main-head {
        align-items: stretch;
        flex-direction: column;
      }

      h1 {
        font-size: 28px;
      }

      .workspace {
        padding: 12px;
      }

      .side-head {
        min-height: 96px;
        align-items: stretch;
        flex-direction: column;
        gap: 10px;
      }

      .side-head .button {
        width: 100%;
      }

      .module-list {
        padding-inline: 12px;
        grid-template-columns: repeat(auto-fit, minmax(136px, 1fr));
        max-height: 188px;
      }

      .module-tab {
        min-width: 0;
      }

      .main-actions {
        align-items: stretch;
        flex-direction: column;
      }

      .month-filter {
        width: 100%;
        align-items: stretch;
        flex-direction: column;
      }

      .month-select {
        width: 100%;
        max-width: none;
      }

      .month-picker {
        width: 100%;
        max-width: none;
      }

      .month-popover {
        width: 100%;
      }

      .month-controls {
        width: 100%;
      }

      .icon-button {
        flex: 0 0 42px;
      }

      .main-actions .button {
        width: 100%;
      }

      .main-actions .icon-button {
        width: 42px;
      }

      .calendar-months {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>绩效配置</h1>
    </header>

    <main class="workspace">
      <section class="board">
        <aside class="month-sidebar">
          <div class="side-head">
            <h2>模块</h2>
          </div>
          <div id="moduleList" class="module-list" aria-label="模块"></div>
        </aside>

        <section class="main">
          <div class="main-head">
            <div class="main-actions">
              <div class="month-filter">
                <span id="filterCaption">筛选月份</span>
                <span class="month-picker">
                  <button id="monthFilter" class="month-select" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="筛选月份">
                    <span id="monthFilterLabel">选择月份</span>
                    <span class="month-caret" aria-hidden="true"></span>
                  </button>
                  <span id="monthFilterPopover" class="month-popover" role="listbox" hidden></span>
                </span>
              </div>
              <div class="month-controls" aria-label="配置操作">
                <span class="add-renewal-target-control">
                  <button id="addMonthBtn" class="button icon-button" type="button" title="新增月份" aria-label="新增月份">+</button>
                  <span id="addRenewalPeriodPopover" class="month-popover add-renewal-period-popover" role="listbox" hidden></span>
                </span>
                <button id="saveBtn" class="button primary" type="button">保存</button>
              </div>
            </div>
          </div>
          <div id="metricTemplateShelf" class="metric-template-shelf" hidden></div>
          <div id="metricWrap" class="metric-wrap"></div>
        </section>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const apiBase = window.PERFORMANCE_CONFIGURATION_API_BASE || "/data_set/performance/configuration";
    const configurationListUrl = `${apiBase}/list`;
    const periodOptionsUrl = `${apiBase}/periodOptions`;
    const adminInfoUrl = `${apiBase}/adminUserInfo`;
    const dualPeriodModules = new Set(["带生数"]);
    const configTypeOptions = ["常规", "招生季"];
    const configurationModules = [
      { id: "performance", label: "绩效配置", enabled: true },
      { id: "renewalTarget", label: "续报目标", enabled: true }
    ];
    const renewalTargetModuleKey = "renewalTarget";
    const renewalTargetRateFields = [
      { key: "allRate", label: "总目标率" },
      { key: "sRate", label: "S档" },
      { key: "aRate", label: "A档" },
      { key: "bRate", label: "B档" },
      { key: "cRate", label: "C档" },
      { key: "dRate", label: "D档" }
    ];
    const defaultRenewalTargetClassModeOptions = ["创新", "笃学", "睿学"];
    const excludedRenewalTargetClassModeOptions = new Set(["合计"]);
    const excludedRenewalTargetClassVersionOptions = new Set(["合计", "创新", "创新版本"]);
    const metricTemplateNames = [
      "带生数",
      "课前退",
      "试听退",
      "课中退",
      "学员回访",
      "新生通话",
      "刷题班上课数据",
      "刷题班课中退",
      "刷题班试听退",
      "小灶课",
      "上课数据"
    ];

    const els = {
      saveBtn: document.getElementById("saveBtn"),
      addMonthBtn: document.getElementById("addMonthBtn"),
      addMetricBtn: document.getElementById("addMetricBtn"),
      moduleList: document.getElementById("moduleList"),
      filterCaption: document.getElementById("filterCaption"),
      monthFilter: document.getElementById("monthFilter"),
      monthFilterLabel: document.getElementById("monthFilterLabel"),
      monthFilterPopover: document.getElementById("monthFilterPopover"),
      addRenewalPeriodPopover: document.getElementById("addRenewalPeriodPopover"),
      metricTemplateShelf: document.getElementById("metricTemplateShelf"),
      metricWrap: document.getElementById("metricWrap"),
      toast: document.getElementById("toast")
    };

    let months = [];
    let records = [];
    let activeMonth = "";
    let renewalTargetRecords = [];
    let renewalTargetPeriodIds = [];
    let renewalTargetPeriodOptions = [];
    let renewalTargetAvailablePeriodOptions = [];
    let activeRenewalPeriodIds = [];
    let activeRenewalPeriodId = "";
    let addRenewalPeriodIds = [];
    let remotePeriodOptions = [];
    let isLoadingConfiguration = true;
    let isLoadingRenewalTargets = true;
    let isLoadingPermission = true;
    const rangeDrafts = new Map();
    let remoteAdminPermissionRows = [];
    let draggingRecordId = "";
    let draggingRenewalTargetId = "";
    let draggingTemplateModule = "";
    let activeModule = "performance";
    let monthPickerOpen = false;
    let addRenewalPeriodPickerOpen = false;
    let openRenewalTargetPicker = null;

    function boot() {
      const state = initialState();
      months = state.months;
      records = applyPreviousMonthDefaults(state.records);
      activeMonth = state.activeMonth;
      render();
      loadConfigurationRows();
      loadRenewalTargetRows();
      loadPeriodOptions();
      loadAdminPermissionRows();
    }

    function initialState() {
      return normalizeState({
        months: [],
        activeMonth: defaultConfigMonth(),
        records: []
      });
    }

    function normalizeState(state) {
      const nextRecords = (Array.isArray(state.records) ? state.records : [])
        .map(normalizeRecord)
        .filter(Boolean);
      normalizeMonthSortOrders(nextRecords);

      const monthSet = new Set((Array.isArray(state.months) ? state.months : []).map(monthKey));
      nextRecords.forEach((record) => {
        if (!record.delFlag) monthSet.add(monthKey(record.configMonth));
      });
      let nextMonths = [...monthSet].filter(Boolean).sort();
      if (!nextMonths.length) nextMonths = [defaultConfigMonth()];

      const preferred = monthKey(state.activeMonth);
      const nextActiveMonth = nextMonths.includes(preferred) ? preferred : nextMonths[nextMonths.length - 1];
      return {
        months: nextMonths,
        records: nextRecords,
        activeMonth: nextActiveMonth
      };
    }

    function normalizeRecord(record) {
      if (!record) return null;
      const configMonth = monthKey(record.configMonth ?? record.config_month);
      if (!configMonth) return null;
      const module = record.module || "";
      const periodFields = normalizedPeriodFields(record, module);
      return {
        id: record.id || makeId(),
        createBy: record.createBy ?? record.create_by ?? "",
        updateBy: record.updateBy ?? record.update_by ?? "",
        createDate: normalizeDateTime(record.createDate ?? record.create_date),
        updateDate: normalizeDateTime(record.updateDate ?? record.update_date),
        configMonth,
        module,
        content: record.content || "",
        timeStart: normalizeDate(record.timeStart ?? record.time_start) || `${configMonth}-01`,
        timeEnd: normalizeDate(record.timeEnd ?? record.time_end) || endOfMonth(configMonth),
        period1: periodFields.period1,
        period2: periodFields.period2,
        periods: periodFields.periods,
        configType: normalizeConfigType(record.configType ?? record.config_type, module),
        sortOrder: normalizeSortOrder(record.sortOrder ?? record.sort_order),
        delFlag: Number(record.delFlag ?? record.del_flag ?? 0)
      };
    }

    function normalizeRenewalTargetState(state) {
      const configuredOptionMap = new Map();
      (Array.isArray(state.renewalPeriodOptions) ? state.renewalPeriodOptions : []).forEach((option) => {
        const normalizedOption = renewalTargetPeriodOption(option);
        if (normalizedOption) configuredOptionMap.set(normalizedOption.id, normalizedOption);
      });

      const availableOptionMap = new Map();
      (Array.isArray(state.availableRenewalPeriodOptions) ? state.availableRenewalPeriodOptions : []).forEach((option) => {
        const normalizedOption = renewalTargetPeriodOption(option);
        if (normalizedOption) availableOptionMap.set(normalizedOption.id, normalizedOption);
      });

      const normalizedRecords = (Array.isArray(state.records) ? state.records : [])
        .map(normalizeRenewalTargetRecord)
        .filter(Boolean);
      const nextRecords = mergeRenewalTargetRecords(normalizedRecords);
      const periodSet = new Set(
        (Array.isArray(state.renewalPeriodIds) ? state.renewalPeriodIds : [])
          .map((value) => normalizeRenewalPeriodGroupKey(value))
          .filter(Boolean)
      );
      const periodNameById = new Map();
      availableOptionMap.forEach((option) => {
        option.periodIds.forEach((periodId) => {
          periodNameById.set(periodId, option.periodName);
        });
      });
      nextRecords.forEach((record) => {
        const groupKey = renewalTargetGroupKeyForRecord(record);
        if (!groupKey) return;
        if (!record.delFlag) periodSet.add(groupKey);
        const periodIds = renewalTargetPeriodIdsForRecord(record);
        const names = periodIds.map((periodId) => {
          if (periodId === normalizeIntegerText(record.renewalPeriodId) && record.renewalPeriodName) {
            return record.renewalPeriodName;
          }
          return periodNameById.get(periodId) || periodId;
        });
        if (!configuredOptionMap.has(groupKey)) {
          configuredOptionMap.set(groupKey, {
            id: groupKey,
            periodIds,
            periodGroupKey: groupKey,
            periodName: names.join("+")
          });
        }
        periodIds.forEach((periodId, index) => {
          if (!availableOptionMap.has(periodId)) {
            availableOptionMap.set(periodId, {
              id: periodId,
              periodIds: [periodId],
              periodGroupKey: periodId,
              periodName: names[index] || periodId
            });
          }
        });
      });
      const nextPeriodIds = [...periodSet]
        .filter(Boolean)
        .sort((a, b) => renewalTargetGroupSortValue(b) - renewalTargetGroupSortValue(a));
      const preferredCandidates = [
        state.activeRenewalPeriodIds,
        state.active_renewal_period_ids,
        state.activeRenewalPeriodId,
        state.active_renewal_period_id
      ];
      let preferredIds = [];
      for (const candidate of preferredCandidates) {
        const normalizedCandidate = (Array.isArray(candidate) ? candidate : [candidate])
          .map((value) => normalizeRenewalPeriodGroupKey(value))
          .filter(Boolean)
          .filter((periodId) => nextPeriodIds.includes(periodId));
        if (normalizedCandidate.length) {
          preferredIds = [normalizedCandidate[0]];
          break;
        }
      }
      const nextActivePeriodIds = preferredIds.length
        ? preferredIds
        : (nextPeriodIds[0] ? [nextPeriodIds[0]] : []);
      return {
        records: nextRecords,
        renewalPeriodIds: nextPeriodIds,
        renewalPeriodOptions: nextPeriodIds.map((id) => configuredOptionMap.get(id) || availableOptionMap.get(id) || {
          id,
          periodIds: normalizeRenewalPeriodGroupIds(id),
          periodGroupKey: id,
          periodName: id
        }),
        availableRenewalPeriodOptions: [...availableOptionMap.values()].sort((a, b) => Number(b.id) - Number(a.id)),
        activeRenewalPeriodIds: nextActivePeriodIds,
        activeRenewalPeriodId: nextActivePeriodIds[0] || ""
      };
    }

    function normalizeRenewalTargetRecord(record) {
      if (!record) return null;
      const renewalPeriodId = normalizeIntegerText(record.renewalPeriodId ?? record.renewal_period_id);
      const sourcePeriodIds = normalizeRenewalPeriodIds(
        record.renewalPeriodIds
          ?? record.renewal_period_ids
          ?? normalizeRenewalPeriodGroupIds(
            record.renewalPeriodGroupKey
              ?? record.renewal_period_group_key
              ?? record.periodGroupKey
              ?? record.period_group_key
              ?? renewalPeriodId
          )
      );
      const renewalPeriodGroupKey = normalizeRenewalPeriodGroupKey(
        record.renewalPeriodGroupKey
          ?? record.renewal_period_group_key
          ?? record.periodGroupKey
          ?? record.period_group_key,
        sourcePeriodIds
      );
      const renewalPeriodIds = normalizeRenewalPeriodIds(
        sourcePeriodIds.length ? sourcePeriodIds : renewalPeriodGroupKey
      );
      const grade = normalizeIntegerText(record.grade);
      if (!renewalPeriodIds.length || !grade) return null;
      const normalized = {
        id: record.id || makeId(),
        renewalPeriodIds,
        renewalPeriodId: renewalPeriodIds[0],
        renewalPeriodGroupKey,
        renewalPeriodName: String(record.renewalPeriodName ?? record.renewal_period_name ?? "").trim(),
        grade,
        classMode: String(record.classMode ?? record.class_mode ?? "").trim(),
        classVersion: String(record.classVersion ?? record.class_version ?? "").trim(),
        allRate: normalizeRateValue(record.allRate ?? record.all_rate),
        sRate: normalizeRateValue(record.sRate ?? record.s_rate),
        aRate: normalizeRateValue(record.aRate ?? record.a_rate),
        bRate: normalizeRateValue(record.bRate ?? record.b_rate),
        cRate: normalizeRateValue(record.cRate ?? record.c_rate),
        dRate: normalizeRateValue(record.dRate ?? record.d_rate),
        sortOrder: normalizeSortOrder(record.sortOrder ?? record.sort_order),
        delFlag: Number(record.delFlag ?? record.del_flag ?? 0)
      };
      const originalRenewalPeriodIds = normalizeRenewalPeriodIds(
        record.originalRenewalPeriodIds
          ?? record.original_renewal_period_ids
          ?? record.originalRenewalPeriodId
          ?? record.original_renewal_period_id
          ?? renewalPeriodIds
      );
      const originalRenewalPeriodGroupKey = normalizeRenewalPeriodGroupKey(
        record.originalRenewalPeriodGroupKey
          ?? record.original_renewal_period_group_key
          ?? record.originalPeriodGroupKey
          ?? record.original_period_group_key,
        originalRenewalPeriodIds
      );
      const key = renewalTargetKey(normalized, renewalPeriodIds[0]);
      return {
        ...normalized,
        originalRenewalPeriodIds,
        originalRenewalPeriodId: originalRenewalPeriodIds[0] || renewalPeriodIds[0],
        originalRenewalPeriodGroupKey,
        originalGrade: normalizeIntegerText(record.originalGrade ?? record.original_grade) || grade,
        originalClassMode: String(record.originalClassMode ?? record.original_class_mode ?? normalized.classMode).trim(),
        originalClassVersion: String(record.originalClassVersion ?? record.original_class_version ?? normalized.classVersion).trim(),
        originalKey: record.originalKey || key
      };
    }

    function normalizeRenewalPeriodIds(value) {
      const values = Array.isArray(value) ? value : [value];
      return unique(values.map(normalizeIntegerText).filter(Boolean))
        .sort((a, b) => Number(b) - Number(a));
    }

    function renewalTargetPeriodIdsForRecord(record) {
      return normalizeRenewalPeriodIds(record?.renewalPeriodIds ?? record?.renewalPeriodId);
    }

    function renewalTargetOriginalPeriodIdsForRecord(record) {
      return normalizeRenewalPeriodIds(
        record?.originalRenewalPeriodIds
          ?? record?.originalRenewalPeriodId
          ?? renewalTargetPeriodIdsForRecord(record)
      );
    }

    function renewalTargetPeriodLabelFromRecord(record, periodId) {
      const primaryId = normalizeIntegerText(periodId);
      if (primaryId === normalizeIntegerText(record?.renewalPeriodId)) {
        return String(record?.renewalPeriodName || "").trim();
      }
      return "";
    }

    function renewalTargetValueKey(record) {
      return [
        renewalTargetGroupKeyForRecord(record),
        normalizeIntegerText(record?.grade),
        String(record?.classMode ?? "").trim(),
        String(record?.classVersion ?? "").trim(),
        normalizeRateValue(record?.allRate),
        normalizeRateValue(record?.sRate),
        normalizeRateValue(record?.aRate),
        normalizeRateValue(record?.bRate),
        normalizeRateValue(record?.cRate),
        normalizeRateValue(record?.dRate)
      ].join("||");
    }

    function mergeRenewalTargetRecords(records) {
      const groups = new Map();
      records.forEach((record) => {
        const key = renewalTargetValueKey(record);
        if (!groups.has(key)) {
          groups.set(key, {
            ...record,
            renewalPeriodIds: [],
            originalRenewalPeriodIds: [],
            renewalPeriodId: "",
            renewalPeriodGroupKey: renewalTargetGroupKeyForRecord(record),
            originalRenewalPeriodId: "",
            originalRenewalPeriodGroupKey: renewalTargetOriginalGroupKeyForRecord(record),
            originalKey: ""
          });
        }
        const group = groups.get(key);
        group.renewalPeriodIds = normalizeRenewalPeriodIds([
          ...group.renewalPeriodIds,
          ...renewalTargetPeriodIdsForRecord(record)
        ]);
        group.originalRenewalPeriodIds = normalizeRenewalPeriodIds([
          ...group.originalRenewalPeriodIds,
          ...renewalTargetOriginalPeriodIdsForRecord(record)
        ]);
        if (!group.renewalPeriodName && record.renewalPeriodName) {
          group.renewalPeriodName = record.renewalPeriodName;
        }
        if (!group.sortOrder || (record.sortOrder && record.sortOrder < group.sortOrder)) {
          group.sortOrder = record.sortOrder;
        }
      });
      return [...groups.values()].map((record) => {
        record.renewalPeriodId = record.renewalPeriodIds[0] || "";
        record.renewalPeriodGroupKey = normalizeRenewalPeriodGroupKey(
          record.renewalPeriodGroupKey,
          record.renewalPeriodIds
        );
        record.originalRenewalPeriodId = record.originalRenewalPeriodIds[0] || record.renewalPeriodId;
        record.originalRenewalPeriodGroupKey = normalizeRenewalPeriodGroupKey(
          record.originalRenewalPeriodGroupKey,
          record.originalRenewalPeriodIds
        );
        record.originalKey = renewalTargetKey(record, record.originalRenewalPeriodId);
        return record;
      });
    }

    function isConfigTypeModule(moduleName) {
      return String(moduleName ?? "").trim() === "带生数";
    }

    function normalizeConfigType(value, moduleName = "") {
      if (!isConfigTypeModule(moduleName)) return "";
      const text = String(value ?? "").trim();
      return configTypeOptions.includes(text) ? text : configTypeOptions[0];
    }

    function normalizeIntegerText(value) {
      const text = String(value ?? "").trim();
      if (!text) return "";
      const number = Number(text);
      return Number.isFinite(number) ? String(Math.trunc(number)) : text;
    }

    function normalizeRenewalPeriodGroupIds(value, fallbackPeriodIds = []) {
      const source = Array.isArray(value)
        ? value
        : String(value ?? "").split("+");
      const fallback = Array.isArray(fallbackPeriodIds) ? fallbackPeriodIds : [fallbackPeriodIds];
      return unique([...source, ...fallback].map(normalizeIntegerText).filter(Boolean))
        .sort((a, b) => Number(b) - Number(a));
    }

    function normalizeRenewalPeriodGroupKey(value, fallbackPeriodIds = []) {
      return normalizeRenewalPeriodGroupIds(value, fallbackPeriodIds).join("+");
    }

    function renewalTargetGroupKeyForRecord(record) {
      return normalizeRenewalPeriodGroupKey(
        record?.renewalPeriodGroupKey
          ?? record?.renewal_period_group_key
          ?? record?.periodGroupKey
          ?? record?.period_group_key,
        record?.renewalPeriodIds ?? record?.renewalPeriodId
      );
    }

    function renewalTargetOriginalGroupKeyForRecord(record) {
      return normalizeRenewalPeriodGroupKey(
        record?.originalRenewalPeriodGroupKey
          ?? record?.original_renewal_period_group_key
          ?? record?.originalPeriodGroupKey
          ?? record?.original_period_group_key,
        record?.originalRenewalPeriodIds
          ?? record?.originalRenewalPeriodId
          ?? renewalTargetPeriodIdsForRecord(record)
      );
    }

    function renewalTargetGroupSortValue(groupKey) {
      const ids = normalizeRenewalPeriodGroupIds(groupKey);
      return ids.length ? Math.max(...ids.map(Number)) : 0;
    }

    function renewalTargetPeriodOption(option, fallbackId = "") {
      if (!option) return null;
      const rawId = option.id
        ?? option.renewalPeriodGroupKey
        ?? option.renewal_period_group_key
        ?? option.renewalPeriodId
        ?? option.renewal_period_id
        ?? fallbackId;
      const periodIds = normalizeRenewalPeriodIds(
        option.periodIds
          ?? option.period_ids
          ?? normalizeRenewalPeriodGroupIds(option.periodGroupKey ?? option.period_group_key ?? rawId)
      );
      const id = normalizeRenewalPeriodGroupKey(
        option.periodGroupKey
          ?? option.period_group_key
          ?? rawId,
        periodIds
      );
      if (!id || !periodIds.length) return null;
      return {
        id,
        periodIds,
        periodGroupKey: id,
        periodName: String(option.periodName ?? option.period_name ?? "").trim() || periodIds.join("+")
      };
    }

    function normalizeRateValue(value) {
      const text = String(value ?? "").trim();
      if (!text) return "";
      if (!/^-?\d+(\.\d+)?$/.test(text)) return text;
      return text.replace(/(\.\d*?)0+$/, "$1").replace(/\.$/, "");
    }

    function renewalTargetKey(record, periodId = null) {
      return [
        renewalTargetGroupKeyForRecord(record),
        normalizeIntegerText(periodId || record?.renewalPeriodId),
        normalizeIntegerText(record?.grade),
        String(record?.classMode ?? "").trim(),
        String(record?.classVersion ?? "").trim()
      ].join("||");
    }

    function normalizeMonthSortOrders(sourceRecords = records, targetMonth = null) {
      const grouped = new Map();
      sourceRecords.forEach((record, sourceIndex) => {
        if (record.delFlag) return;
        const key = monthKey(record.configMonth);
        if (targetMonth && key !== monthKey(targetMonth)) return;
        if (!grouped.has(key)) grouped.set(key, []);
        grouped.get(key).push({ record, sourceIndex });
      });

      grouped.forEach((items) => {
        items
          .sort((a, b) => {
            const byOrder = sortOrderValue(a.record) - sortOrderValue(b.record);
            if (byOrder) return byOrder;
            return a.sourceIndex - b.sourceIndex;
          })
          .forEach((item, index) => {
            item.record.sortOrder = index + 1;
          });
      });
    }

    function normalizeSortOrder(value) {
      const number = Number(value);
      return Number.isFinite(number) && number > 0 ? number : null;
    }

    function sortOrderValue(record) {
      return normalizeSortOrder(record?.sortOrder) || Number.MAX_SAFE_INTEGER;
    }

    function compareRecordOrder(a, b) {
      const byOrder = sortOrderValue(a) - sortOrderValue(b);
      if (byOrder) return byOrder;
      return String(a.module).localeCompare(String(b.module), "zh-Hans-CN");
    }

    async function loadConfigurationRows() {
      isLoadingConfiguration = true;
      render();

      try {
        const data = await postJson(configurationListUrl, configurationListRequestBody());
        const state = configurationStateFromResponse(data);
        months = state.months;
        records = applyPreviousMonthDefaults(state.records);
        activeMonth = state.activeMonth;
      } catch (error) {
        console.warn("load performance configuration failed", error);
        showToast("配置接口失败，请检查后端连接");
      } finally {
        isLoadingConfiguration = false;
        render();
      }
    }

    function configurationListRequestBody() {
      return { delFlag: 0 };
    }

    function configurationStateFromResponse(data) {
      const payload = unwrapData(data) || {};
      return normalizeState({
        months: payload.months || [],
        activeMonth: payload.activeMonth || defaultConfigMonth(),
        records: Array.isArray(payload.records) ? payload.records : []
      });
    }

    async function loadRenewalTargetRows() {
      isLoadingRenewalTargets = true;
      render();

      try {
        const preferredPeriodGroupKeys = activeRenewalPeriodIds.length
          ? [activeRenewalPeriodIds[0]]
          : (activeRenewalPeriodId ? [activeRenewalPeriodId] : []);
        const data = await postJson(configurationListUrl, { moduleKey: renewalTargetModuleKey });
        const state = renewalTargetStateFromResponse(data, preferredPeriodGroupKeys);
        renewalTargetRecords = state.records;
        renewalTargetPeriodIds = state.renewalPeriodIds;
        renewalTargetPeriodOptions = state.renewalPeriodOptions;
        renewalTargetAvailablePeriodOptions = state.availableRenewalPeriodOptions;
        activeRenewalPeriodIds = state.activeRenewalPeriodIds;
        activeRenewalPeriodId = state.activeRenewalPeriodId;
      } catch (error) {
        console.warn("load renewal target rates failed", error);
        showToast("续报目标接口失败，请检查后端连接");
      } finally {
        isLoadingRenewalTargets = false;
        render();
      }
    }

    function renewalTargetStateFromResponse(data, preferredPeriodGroupKeys = []) {
      const payload = unwrapData(data) || {};
      if (payload.moduleKey && payload.moduleKey !== renewalTargetModuleKey) {
        console.warn("ignore non-renewal target response", payload.moduleKey);
        return normalizeRenewalTargetState({});
      }
      return normalizeRenewalTargetState({
        records: Array.isArray(payload.records) ? payload.records : [],
        renewalPeriodIds: payload.renewalPeriodIds || payload.renewal_period_ids || [],
        renewalPeriodOptions: payload.renewalPeriodOptions || payload.renewal_period_options || [],
        availableRenewalPeriodOptions: payload.availableRenewalPeriodOptions || payload.available_renewal_period_options || [],
        activeRenewalPeriodIds: preferredPeriodGroupKeys.length
          ? preferredPeriodGroupKeys
          : (payload.activeRenewalPeriodIds || payload.active_renewal_period_ids || []),
        activeRenewalPeriodId: preferredPeriodGroupKeys[0]
          || payload.activeRenewalPeriodId
          || payload.active_renewal_period_id
          || ""
      });
    }

    function resolvePermissionState() {
      const rows = remoteAdminPermissionRows.map(normalizeAdminPermissionRow).filter(Boolean).filter(isActiveAdminPermissionRow);
      const canEdit = rows.some((row) => Number(row.permissionScope) === 2);
      return {
        canView: isLoadingPermission || canEdit || rows.length > 0,
        canEdit: !isLoadingPermission && canEdit,
        loading: isLoadingPermission,
        source: "dim_org_admin_user_info_hf",
        rows
      };
    }

    async function loadAdminPermissionRows() {
      isLoadingPermission = true;
      render();

      try {
        const data = await postJson(adminInfoUrl, {});
        remoteAdminPermissionRows = responseRows(data);
      } catch (error) {
        console.warn("load admin permission failed", error);
        showToast("权限接口失败");
      } finally {
        isLoadingPermission = false;
        render();
      }
    }

    function normalizeAdminPermissionRow(row) {
      if (!row || typeof row !== "object") return null;
      return {
        adminId: row.adminId ?? row.admin_id ?? "",
        mobile: row.mobile ?? "",
        status: row.status ?? "",
        userName: row.userName ?? row.user_name ?? "",
        roleId: row.roleId ?? row.role_id ?? "",
        roleName: row.roleName ?? row.role_name ?? "",
        adminOrganId: row.adminOrganId ?? row.admin_organ_id ?? "",
        organName: row.organName ?? row.organ_name ?? "",
        isFullView: row.isFullView ?? row.is_full_view ?? 0,
        permissionType: row.permissionType ?? row.permission_type ?? "",
        permissionScope: row.permissionScope ?? row.permission_scope ?? "",
        adminOrganIds: row.adminOrganIds ?? row.admin_organ_ids ?? "",
        parentIds: row.parentIds ?? row.parent_ids ?? "",
        teacherUid: row.teacherUid ?? row.teacher_uid ?? "",
        subject: row.subject ?? "",
        isGroupLeader: row.isGroupLeader ?? row.is_group_leader ?? 0
      };
    }

    function isActiveAdminPermissionRow(row) {
      return row.status === true || String(row.status).toLowerCase() === "true" || Number(row.status) === 1;
    }

    function currentAdminId() {
      return resolvePermissionState().rows[0]?.adminId || "";
    }

    function requireEditPermission() {
      if (resolvePermissionState().canEdit) return true;
      showToast("暂无编辑权限");
      return false;
    }

    function applyPreviousMonthDefaults(inputRecords) {
      const sorted = [...inputRecords].sort((a, b) => {
        const byMonth = monthKey(a.configMonth).localeCompare(monthKey(b.configMonth));
        if (byMonth) return byMonth;
        return String(a.module).localeCompare(String(b.module), "zh-Hans-CN");
      });
      const latestContentByModule = new Map();

      sorted.forEach((record) => {
        const moduleKey = record.module.trim();
        if (!moduleKey) return;
        if (!record.content.trim() && latestContentByModule.has(moduleKey)) {
          record.content = latestContentByModule.get(moduleKey);
        }
        if (record.content.trim()) {
          latestContentByModule.set(moduleKey, record.content);
        }
      });

      const allContentByModule = new Map();
      sorted.forEach((record) => {
        const moduleKey = record.module.trim();
        if (moduleKey && record.content.trim() && !allContentByModule.has(moduleKey)) {
          allContentByModule.set(moduleKey, record.content);
        }
      });

      sorted.forEach((record) => {
        const moduleKey = record.module.trim();
        if (moduleKey && !record.content.trim() && allContentByModule.has(moduleKey)) {
          record.content = allContentByModule.get(moduleKey);
        }
      });
      return inputRecords;
    }

    function render() {
      const auth = resolvePermissionState();
      applyPermissionControls(auth);
      if (auth.loading) {
        renderLoading("正在加载权限。");
        return;
      }
      if (!auth.canView) {
        renderNoPermission();
        return;
      }
      renderModules();
      if (activeModule === renewalTargetModuleKey) {
        renderRenewalTargetFilter(auth);
        renderAddRenewalPeriodPicker(auth);
        els.metricTemplateShelf.hidden = true;
        els.metricTemplateShelf.innerHTML = "";
        renderRenewalTargets(auth);
        return;
      }
      closeAddRenewalPeriodPicker();
      renderMonthFilter(auth);
      renderMetricTemplates(auth);
      renderMetrics(auth);
    }

    function applyPermissionControls(auth) {
      [els.addMonthBtn, els.saveBtn].forEach((button) => {
        button.hidden = !auth.canEdit;
        button.disabled = !auth.canEdit;
      });
      els.addMonthBtn.title = activeModule === renewalTargetModuleKey ? "新增目标行" : "新增月份";
      els.addMonthBtn.setAttribute("aria-label", els.addMonthBtn.title);
      if (els.addMetricBtn) {
        els.addMetricBtn.hidden = true;
        els.addMetricBtn.disabled = true;
      }
    }

    function renderLoading(message) {
      renderModules();
      resetMonthFilter(activeModule === renewalTargetModuleKey ? "选择期次" : "选择月份");
      closeAddRenewalPeriodPicker();
      els.metricTemplateShelf.hidden = true;
      els.metricTemplateShelf.innerHTML = "";
      els.metricWrap.innerHTML = `<div class="empty-state">${escapeHtml(message)}</div>`;
    }

    function renderNoPermission() {
      renderModules();
      resetMonthFilter(activeModule === renewalTargetModuleKey ? "选择期次" : "选择月份");
      closeAddRenewalPeriodPicker();
      els.metricTemplateShelf.hidden = true;
      els.metricTemplateShelf.innerHTML = "";
      els.metricWrap.innerHTML = `<div class="empty-state">暂无权限查看${escapeHtml(activeModuleLabel())}。</div>`;
    }

    function renderModules() {
      els.moduleList.innerHTML = "";

      configurationModules.forEach((module) => {
        const item = document.createElement("div");
        item.className = "module-item";

        const tab = document.createElement("button");
        tab.type = "button";
        tab.className = [
          "module-tab",
          module.id === activeModule ? "active" : "",
          module.enabled ? "" : "is-disabled"
        ].filter(Boolean).join(" ");
        tab.textContent = module.label;
        tab.setAttribute("aria-disabled", String(!module.enabled));
        if (!module.enabled) tab.title = "暂未接入";
        tab.addEventListener("click", () => {
          if (!module.enabled) {
            showToast("该模块暂未接入");
            return;
          }
          if (activeModule === module.id) return;
          activeModule = module.id;
          draggingRenewalTargetId = "";
          closeMonthPicker();
          closeAddRenewalPeriodPicker();
          closeRenewalTargetPicker(false);
          closeRangePopovers();
          closePeriodPopovers();
          render();
        });

        item.appendChild(tab);
        els.moduleList.appendChild(item);
      });
    }

    function activeModuleLabel() {
      return configurationModules.find((module) => module.id === activeModule)?.label || "配置";
    }

    function renderMonthFilter(auth = resolvePermissionState()) {
      els.filterCaption.textContent = "筛选月份";
      els.monthFilter.setAttribute("aria-label", "筛选月份");
      els.monthFilterPopover.setAttribute("aria-multiselectable", "false");
      els.monthFilterPopover.classList.remove("renewal-target-period-popover");
      const orderedMonths = [...months].sort().reverse();
      const disabled = !auth.canView || !orderedMonths.length;
      if (disabled) {
        resetMonthFilter(activeMonth ? formatMonthLabel(activeMonth) : "选择月份");
        return;
      }

      els.monthFilterLabel.textContent = activeMonth ? formatMonthLabel(activeMonth) : "选择月份";
      els.monthFilter.disabled = false;
      els.monthFilter.setAttribute("aria-expanded", String(monthPickerOpen));
      els.monthFilterPopover.hidden = !monthPickerOpen;
      els.monthFilterPopover.innerHTML = monthPickerMarkup(orderedMonths);
      els.monthFilterPopover.querySelectorAll("[data-month]").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          selectMonth(button.dataset.month);
        });
      });
    }

    function renderRenewalTargetFilter(auth = resolvePermissionState()) {
      els.filterCaption.textContent = "筛选期次";
      els.monthFilter.setAttribute("aria-label", "筛选期次");
      els.monthFilterPopover.setAttribute("aria-multiselectable", "false");
      els.monthFilterPopover.classList.add("renewal-target-period-popover");
      const orderedPeriodIds = [...renewalTargetPeriodIds].sort(
        (a, b) => renewalTargetGroupSortValue(b) - renewalTargetGroupSortValue(a)
      );
      const disabled = !auth.canView || !orderedPeriodIds.length;
      if (disabled) {
        resetMonthFilter(renewalTargetFilterLabel() || "选择期次");
        return;
      }

      els.monthFilterLabel.textContent = renewalTargetFilterLabel() || "选择期次";
      els.monthFilter.title = renewalTargetFilterTitle();
      els.monthFilter.disabled = false;
      els.monthFilter.setAttribute("aria-expanded", String(monthPickerOpen));
      els.monthFilterPopover.hidden = !monthPickerOpen;
      els.monthFilterPopover.innerHTML = renewalTargetPeriodPickerMarkup(orderedPeriodIds);
      els.monthFilterPopover.querySelectorAll("[data-renewal-period-id]").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          selectRenewalTargetPeriod(button.dataset.renewalPeriodId);
        });
      });
    }

    function renderAddRenewalPeriodPicker(auth = resolvePermissionState()) {
      if (!auth.canEdit || activeModule !== renewalTargetModuleKey || !addRenewalPeriodPickerOpen) {
        els.addRenewalPeriodPopover.hidden = true;
        els.addRenewalPeriodPopover.innerHTML = "";
        return;
      }

      const options = renewalTargetAvailablePeriodOptions.length
        ? renewalTargetAvailablePeriodOptions
        : renewalTargetPeriodOptions;
      els.addRenewalPeriodPopover.hidden = false;
      els.addRenewalPeriodPopover.innerHTML = renewalTargetAddPeriodPickerMarkup(options);
      els.addRenewalPeriodPopover.querySelectorAll("[data-add-renewal-period-id]").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          toggleAddRenewalTargetPeriod(button.dataset.addRenewalPeriodId);
        });
      });
      els.addRenewalPeriodPopover.querySelector("[data-add-renewal-period-confirm]")?.addEventListener("click", (event) => {
        event.stopPropagation();
        selectRenewalTargetPeriodForNewRow(addRenewalPeriodIds);
      });
    }

    function resetMonthFilter(label = "选择月份") {
      const caption = activeModule === renewalTargetModuleKey ? "筛选期次" : "筛选月份";
      els.filterCaption.textContent = caption;
      els.monthFilter.setAttribute("aria-label", caption);
      monthPickerOpen = false;
      els.monthFilterLabel.textContent = label;
      els.monthFilter.title = label;
      els.monthFilter.disabled = true;
      els.monthFilter.setAttribute("aria-expanded", "false");
      els.monthFilterPopover.classList.remove("renewal-target-period-popover");
      els.monthFilterPopover.hidden = true;
      els.monthFilterPopover.innerHTML = "";
    }

    function renewalTargetAddPeriodPickerMarkup(options) {
      return `
        <span class="renewal-add-period-panel" role="group" aria-label="新增续报目标">
          <span class="renewal-add-period-title">选择期次（可多选）</span>
          <span class="renewal-add-period-list" role="listbox" aria-label="选择期次">
            ${options.map((option) => `
              <button class="renewal-add-period-option${addRenewalPeriodIds.includes(String(option.id)) ? " active" : ""}" type="button" role="option" aria-selected="${addRenewalPeriodIds.includes(String(option.id))}" data-add-renewal-period-id="${escapeAttr(option.id)}" title="${escapeAttr(option.periodName || renewalTargetPeriodLabel(option.id))}">
                ${escapeHtml(option.periodName || renewalTargetPeriodLabel(option.id))}
              </button>

          </span>
          <button class="renewal-add-period-confirm button primary" type="button" data-add-renewal-period-confirm>新增目标行</button>
        </span>
      `;
